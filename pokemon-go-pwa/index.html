<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pokémon GO — Low Poly Collection</title>
<meta name="description" content="A low-poly Pokémon GO experience. Swipe to throw Poké Balls, use berries, collect Pokémon across biomes. Bilingual. Progressive Web App.">
<meta name="theme-color" content="#0a0a14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app-root">
  <div class="top-bar" id="top-bar">
    <span class="tb-stat">Pokémon GO</span>
    <span style="flex:1"></span>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="btn-catch" onclick="switchTab('catch')">🎯 Catch</button>
    <button class="tab-btn" id="btn-pokedex" onclick="switchTab('pokedex')">📖 Pokédex</button>
    <button class="tab-btn" id="btn-inventory" onclick="switchTab('inventory')">🎒 Items</button>
    <button class="tab-btn" id="btn-shop" onclick="switchTab('shop')">🏪 Shop</button>
    <button class="tab-btn" id="btn-collection" onclick="switchTab('collection')">📦 Collection</button>
    <button class="tab-btn" id="btn-trainer" onclick="switchTab('trainer')">👤 Trainer</button>
    <button class="tab-btn" id="btn-research" onclick="switchTab('research')">🔬 Research</button>
  </div>

  <!-- CATCH TAB -->
  <div class="tab-panel" id="tab-catch">
    <div class="biome-bar" id="biome-selector"></div>
    <div class="nearby-radar" id="nearby-radar"></div>
    <div class="stage-wrap">
      <canvas id="stage-canvas"></canvas>
      <div id="ambient-overlay" class="ambient-overlay"></div>
      <div id="combo-overlay" class="combo-overlay hidden"><span id="combo-text"></span></div>
      <div id="time-badge" class="time-badge"></div>
      <div class="stage-overlay">
        <div class="stage-info" id="stage-info">
          <div style="font-family:var(--font-display);color:var(--accent-light);font-size:1.1rem;">Choose a biome</div>
        </div>
        <div class="stage-controls">
          <button class="menu-button spin-btn" style="font-size:0.8rem;padding:0.5rem 1rem;" onclick="window.doSpin()">🌀 Spin</button>
          <button class="menu-button" style="font-size:0.8rem;padding:0.5rem 1rem;" onclick="spawnWildPokemon()">🔄 New</button>
        </div>
      </div>
    </div>
    <p class="swipe-hint">Swipe up to throw a Poké Ball</p>
  </div>

  <!-- POKEDEX TAB -->
  <div class="tab-panel hidden" id="tab-pokedex">
    <div id="pokedex-filters" class="pd-filters"></div>
    <div id="pokedex-gen" class="pd-gen"></div>
    <p id="pokedex-count" class="pd-count"></p>
    <div id="pokedex-grid"></div>
  </div>

  <!-- INVENTORY TAB -->
  <div class="tab-panel hidden" id="tab-inventory">
    <div id="inventory-grid"></div>
  </div>

  <!-- SHOP TAB -->
  <div class="tab-panel hidden" id="tab-shop">
    <div id="shop-grid"></div>
  </div>

  <!-- COLLECTION TAB -->
  <div class="tab-panel hidden" id="tab-collection">
    <div id="collection-filters" class="collection-filters"></div>
    <p id="collection-count" class="pd-count"></p>
    <div id="collection-grid"></div>
  </div>

  <!-- TRAINER TAB -->
  <div class="tab-panel hidden" id="tab-trainer">
    <div id="trainer-panel"></div>
  </div>

  <!-- RESEARCH TAB -->
  <div class="tab-panel hidden" id="tab-research">
    <div id="research-grid"></div>
  </div>

  <!-- SETTINGS -->
  <div class="tab-panel hidden" id="tab-settings">
    <div class="settings-list">
      <div class="setting-row">
        <span class="setting-label">Sound Effects</span>
        <button class="toggle on" id="tog-sound" aria-label="Sound" onclick="this.classList.toggle('on');toggleSound()"></button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Haptics</span>
        <button class="toggle on" id="tog-haptics" aria-label="Haptics" onclick="this.classList.toggle('on');toggleHaptics()"></button>
      </div>
      <div class="setting-row">
        <span class="setting-label">Language / Lingua</span>
        <button class="menu-button" style="padding:0.4rem 0.8rem;font-size:0.8rem;" onclick="switchLang()">EN ↔ IT</button>
      </div>
      <button class="danger-btn" onclick="resetGame()">Reset All Progress</button>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div id="result-modal" class="result-modal hidden">
  <div class="rm-panel">
    <div class="rm-title">Result</div>
    <div class="rm-body"></div>
    <button class="rm-btn" onclick="closeResult()">Continue</button>
  </div>
</div>

<!-- Pokémon Detail Modal -->
<div id="detail-modal" class="detail-modal hidden">
  <div class="dm-panel">
    <div class="dm-close" onclick="window.closeDetail()">✕</div>
    <div class="dm-sprite" id="dm-sprite"></div>
    <div class="dm-name" id="dm-name"></div>
    <div class="dm-types" id="dm-types"></div>
    <div class="dm-stats" id="dm-stats"></div>
    <div class="dm-desc" id="dm-desc"></div>
    <div class="dm-actions" id="dm-actions"></div>
  </div>
</div>

<!-- Start Menu -->
<div id="start-menu" class="menu-screen">
  <div class="menu-panel">
    <h1>Pokémon GO</h1>
    <p class="sub">A low-poly Pokémon GO experience. Swipe to throw Poké Balls. Use berries. Collect them all across different biomes. Bilingual English / Italiano.</p>
    <button class="menu-button menu-cta" onclick="startGame()">Begin Adventure — Inizia l'Avventura</button>
    <button class="menu-button" style="font-size:0.85rem;padding:0.5rem 1rem;" onclick="switchLang()">Lingua: English / Italiano</button>
  </div>
</div>

<!-- Toast container -->
<div id="toast-box" class="toast-box"></div>

<script type="module" src="src/config.js"></script>
<script type="module" src="src/storage.js"></script>
<script type="module" src="src/renderer.js"></script>
<script type="module" src="src/main.js"></script>
<script src="../shared/arcade.js"></script>
</body>
</html>

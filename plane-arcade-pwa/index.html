<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plane Arcade</title>
    <meta name="description" content="A one-thumb portrait neon shoot-'em-up. Drag to fly, auto-fire, collect power-ups and survive waves and bosses.">
    <meta name="theme-color" content="#ffaa00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>
<body>
    <div id="app">
        <header>
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">▲</span>
                <h1>PLANE ARCADE</h1>
            </div>
            <div class="hud">
                <div class="stat score-stat">
                    <span>SCORE</span>
                    <b id="score">0</b>
                    <small>HI <span id="high-score">0</span></small>
                </div>
                <div class="stat"><span>WAVE</span><b id="wave">1</b></div>
                <div class="stat lives"><span>LIVES</span><b id="lives">♥♥♥</b></div>
                <button id="pause-btn" class="icon-btn" type="button" aria-label="Pause game">⏸</button>
                <button id="mute-btn" class="icon-btn" type="button" aria-label="Mute sound">🔊</button>
            </div>
        </header>

        <main>
            <canvas id="game-canvas" width="400" height="600" aria-label="Plane Arcade playfield"></canvas>
            <div id="toast" class="toast hidden" role="status"></div>
            <div id="debug" class="debug hidden" aria-hidden="true"></div>
            <div id="rotate-hint" class="rotate-hint hidden">
                <div class="rotate-icon" aria-hidden="true">↻</div>
                <p>Rotate your device to portrait</p>
            </div>
        </main>

        <footer>
            <div id="power-status" class="power-status">DRAG TO FLY · AUTO-FIRE</div>
            <button id="bomb-btn" class="bomb-btn" type="button" aria-label="Use bomb">
                <span class="bomb-icon" aria-hidden="true">💣</span>
                <span class="bomb-label">BOMB</span>
                <b id="bomb-count">2</b>
            </button>
        </footer>

        <div id="overlay" class="overlay hidden">
            <div class="panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
                <p class="kicker">NEON ARCADE</p>
                <h2 id="overlay-title">PLANE ARCADE</h2>
                <p id="overlay-msg">Drag to fly. Auto-fire. Survive.</p>
                <div id="overlay-badge" class="badge hidden">NEW HIGH SCORE</div>
                <div id="overlay-stats" class="overlay-stats hidden">
                    <div><span>SCORE</span><b id="final-score">0</b></div>
                    <div><span>HIGH</span><b id="final-high">0</b></div>
                    <div><span>WAVE</span><b id="final-wave">1</b></div>
                </div>
                <div class="panel-actions">
                    <button id="overlay-play" class="btn primary" type="button">▶ PLAY</button>
                    <button id="overlay-restart" class="btn hidden" type="button">↻ RESTART</button>
                    <button id="overlay-weekly" class="btn" type="button">🏆 WEEKLY</button>
                    <button id="overlay-hangar" class="btn" type="button">🛠 HANGAR</button>
                    <button id="overlay-theme" class="btn" type="button">🎨 THEME</button>
                    <button id="overlay-sound" class="btn" type="button">🔊 SOUND</button>
                </div>
                <p class="panel-hint" id="overlay-hint">S spread · R rapid · H shield · B bomb</p>
            </div>
        </div>

        <div id="hangar-overlay" class="overlay hidden">
            <div class="panel hangar-panel" role="dialog" aria-modal="true" aria-labelledby="hangar-title">
                <div class="hangar-tabs">
                    <button class="hangar-tab active" data-tab="loadout" type="button">⚔ LOADOUT</button>
                    <button class="hangar-tab" data-tab="medals" type="button">🏅 MEDALS</button>
                    <button class="hangar-tab" data-tab="missions" type="button">📋 MISSIONS</button>
                    <button class="hangar-tab" data-tab="career" type="button">📊 CAREER</button>
                    <button class="hangar-tab" data-tab="weekly" type="button">🏆 WEEKLY</button>
                </div>
                <div id="hangar-content"></div>
                <div class="panel-actions">
                    <button id="hangar-close" class="btn primary" type="button">✕ CLOSE</button>
                </div>
            </div>
        </div>

        <div id="install-prompt" class="install-prompt hidden">
            <p>Install Plane Arcade for offline play?</p>
            <div class="install-actions">
                <button id="install-btn" class="btn primary" type="button">Install</button>
                <button id="install-later" class="btn" type="button">Later</button>
            </div>
        </div>
    </div>

    <script src="../shared/arcade.js"></script>
    <script src="game.js"></script>
</body>
</html>

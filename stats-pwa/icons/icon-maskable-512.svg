<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: a launcher may crop this to a circle or a squircle,
       so the artwork is scaled into the middle 80% and the background is a
       full-bleed rect rather than a rounded square. Anything outside the
       safe circle would be clipped. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b2e"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(0.64) translate(-256 -256)">
    <g opacity="0.95">
      <rect x="118" y="318" width="59" height="108" rx="13" fill="#5b8def"/>
      <rect x="213" y="254" width="59" height="172" rx="13" fill="#5b8def"/>
      <rect x="308" y="189" width="59" height="237" rx="13" fill="#5b8def"/>
      <rect x="403" y="124" width="59" height="302" rx="13" fill="#e8a924"/>
    </g>

    <path d="M98 346 L188 292 L278 238 L368 157 L440 108"
          fill="none" stroke="#e8eaf2" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <circle cx="440" cy="108" r="21" fill="#0d0f16" stroke="#e8eaf2" stroke-width="13"/>
  </g>
</svg>
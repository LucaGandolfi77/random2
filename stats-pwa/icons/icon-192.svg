<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Three bars of increasing height plus a trend line: the dashboard, at
       icon size. Drawn as shapes rather than text so it renders identically
       everywhere and costs nothing to load. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b2e"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <g opacity="0.95">
    <rect x="34" y="118" width="22" height="40" rx="5" fill="#5b8def"/>
    <rect x="64" y="94" width="22" height="64" rx="5" fill="#5b8def"/>
    <rect x="94" y="70" width="22" height="88" rx="5" fill="#5b8def"/>
    <rect x="124" y="46" width="22" height="112" rx="5" fill="#e8a924"/>
  </g>

  <path d="M28 128 L58 108 L88 88 L118 58 L150 40"
        fill="none" stroke="#e8eaf2" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <circle cx="150" cy="40" r="8" fill="#0d0f16" stroke="#e8eaf2" stroke-width="5"/>
</svg>
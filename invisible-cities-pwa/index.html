  <h1 class="ls-heading">Invisible Cities — Act II</h1>
  <p class="ls-sub">The story continues from the scene that begins in the anthology. In English and Italian.</p>
  <div id="scene"></div>
  <div class="ls-foot"><a href="../anthology-pwa/">← The Library — La Biblioteca</a></div>

<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "Euphemia", it: "Eufemia" },
  place: { en: "A trading city on the winter route", it: "Una città di scambi sulla rotta d'inverno" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "A trading city on the winter caravan route: seven days' camel ride in any direction, and water so scarce it is remembered rather than drunk.", it: "Una città di scambi sulla rotta invernale delle carovane: sette giorni di cammello in tutte le direzioni, e acqua così scarsa che viene ricordata più che bevuta." } },
    { s: "Marco Polo", t: { en: "In Euphemia, goods and words are traded at the same stalls. The caravans arrive, and for seven days the city inventories not only salt and fish, but everything that happened between one moon and the next.", it: "A Eufemia le merci e le parole si scambiano negli stessi banchi. Le carovane arrivano, e per sette giorni la città fa l'inventario non solo del sale e del pesce, ma di tutto ciò che è accaduto tra una luna e l'altra." } },
    { s: "Kublai Khan", t: { en: "And when the caravans leave?", it: "E quando le carovane partono?" } },
    { s: "Marco Polo", t: { en: "The city keeps only what can be said again. Its memory is the memory of a market: crowded, competitive, wrong in detail, indispensable.", it: "La città conserva soltanto ciò che si può dire di nuovo. La sua memoria è la memoria di un mercato: affollata, competitiva, sbagliata nei dettagli, indispensabile." } },
    { s: N, t: { en: "By evening, strangers who met at dawn are bargaining over a wolf-pack's strategy, a marriage in a far oasis, the price of a rumor about a river that moved.", it: "Sera: sconosciuti incontrati all'alba contrattano la strategia di un branco di lupi, un matrimonio in un'oasi lontana, il prezzo di una voce su un fiume che si è spostato." } },
    { s: "Marco Polo", t: { en: "Some stories are traded so often they lose their owner. In Euphemia there are tales with no author left, walking the alleys like stray dogs, fed by everyone.", it: "Alcune storie sono scambiate così spesso che perdono il proprietario. A Eufemia ci sono racconti rimasti senza autore, che camminano per i vicoli come cani randagi, nutriti da tutti." } },
    { s: "Kublai Khan", t: { en: "And what of the traveler who has nothing to tell?", it: "E il viaggiatore che non ha niente da raccontare?" } },
    { s: "Marco Polo", t: { en: "He pays with listening. The city mints a coin for silence too; it is the rarest currency on the route.", it: "Paga con l'ascolto. La città conia una moneta anche per il silenzio; è la valuta più rara della rotta." } }
  ],
  choices: [
    { text: { en: "Trade the story of your own city.", it: "Scambia la storia della tua città." }, lines: [
      { s: "Marco Polo", t: { en: "I gave them Venice — the canals, the ferryman's oaths, the city that is afraid of drowning in beauty. They paid in a storm on the Chinese sea and a grandmother's recipe. We were richer than at dawn, and no ledger would show it.", it: "Ho dato loro Venezia — i canali, gli improperi del traghettatore, la città che teme di annegare nella bellezza. Hanno pagato con una tempesta sul mar Cinese e la ricetta di una nonna. Eravamo più ricchi che all'alba, e nessun registro lo mostrerebbe." } }
    ] },
    { text: { en: "Pay with listening, all seven days.", it: "Paga con l'ascolto, per tutti e sette i giorni." }, lines: [
      { s: N, t: { en: "He says nothing for a week. On the eighth day he knows the route better than any map — every waterhole is a sentence, every pass a punctuation. The Khan receives a report that is mostly silence, and understands it completely.", it: "Non dice niente per una settimana. L'ottavo giorno conosce la rotta meglio di qualsiasi mappa — ogni pozza d'acqua è una frase, ogni valico una punteggiatura. Il Khan riceve un rapporto fatto soprattutto di silenzio, e lo comprende del tutto." } }
    ] }
  ],
  outro: { en: "Trade is the oldest way of remembering out loud.", it: "Il commercio è il modo più antico di ricordare ad alta voce." }
});
</script>

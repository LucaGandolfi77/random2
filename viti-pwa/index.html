<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Viti & Lastre</title>
  <meta name="description" content="Svita, sposta e riavvita le viti giuste: le lastre cadono con fisica vera. Viti arrugginite, molle, vetro fragile e catene di demolizione.">
  <meta name="theme-color" content="#c98d4e">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Viti">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <span class="chip" id="lvl-name">Livello 1</span>
        <span class="chip" id="ops">🪛 0/4</span>
      </div>
      <div class="hud-right">
        <button id="levels-btn" class="iconbtn" aria-label="Livelli">☰</button>
        <button id="retry-btn" class="iconbtn" aria-label="Ricomincia">↺</button>
        <button id="sound-btn" class="iconbtn" aria-label="Audio">🔊</button>
      </div>
    </header>

    <main id="stage"><canvas id="game"></canvas></main>

    <footer id="traybar">
      <div id="tray" aria-label="Portaviti"></div>
      <div id="hint"></div>
    </footer>

    <div id="modal" class="overlay">
      <div class="sheet">
        <h2 id="m-title">Viti & Lastre</h2>
        <div id="m-body"></div>
        <div id="m-btns"></div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <script src="../shared/arcade.js"></script>
  <script src="game.js"></script>
  <script src="service-worker.js"></script>
</body>
</html>

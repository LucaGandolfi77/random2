<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "The Attic Offices", it: "Gli uffici sotto il tetto" },
  place: { en: "Somewhere in the city, upstairs", it: "Da qualche parte in città, al piano di sopra" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "The Court, it turns out, has offices everywhere: in attics, in laundries, behind a courtyard where children play between the queues.", it: "La Corte, a quanto pare, ha uffici ovunque: nei sottotetti, nei lavatoi, dietro un cortile dove i bambini giocano tra le file che aspettano." } },
    { s: "Josef K.", t: { en: "This is not a court of law. There are no benches, no bar, no witness box — only a stuffy room and a crowd of men waiting for the floor to creak.", it: "Questo non è un tribunale. Non ci sono banchi, né barriera, né banco dei testimoni — solo una stanza afosa e una folla di uomini che aspettano che il pavimento scricchioli." } },
    { s: { en: "Usher", it: "L'Uschiere" }, t: { en: "The preliminary hearing is a formality. The Court prefers to examine the accused before officials who have not been promoted for years, so their bitterness stays fresh.", it: "Il primo esame è una formalità. La Corte preferisce esaminare l'imputato davanti a funzionari che non vengono promossi da anni, così la loro amarezza resta fresca." } },
    { s: "Josef K.", t: { en: "Then I will speak. A man who is innocent must say so loudly, or the silence becomes a confession.", it: "Allora parlerò. Un uomo innocente deve dirlo ad alta voce, o il silenzio diventa una confessione." } },
    { s: N, t: { en: "He stands on a chair and names the Court: corrupt, secretive, absurd. The clerks nod gravely and write down that he spoke.", it: "Si mette in piedi su una sedia e dà un nome alla Corte: corrotta, segreta, assurda. Gli impiegati annuiscono con gravità e annotano che ha parlato." } },
    { s: { en: "The Painter", it: "Il Pittore" }, t: { en: "You look like a man who has been told he is innocent. Sit. I paint judges; I know the type. There are three ways out: actual acquittal, apparent acquittal, and indefinite postponement. I have never met the first.", it: "Lei sembra un uomo al quale hanno detto che è innocente. Si sieda. Io ritraggo giudici; conosco la razza. Ci sono tre vie d'uscita: assoluzione vera, assoluzione apparente, e rinvio indefinito. La prima non l'ho mai vista." } },
    { s: "Josef K.", t: { en: "Apparent acquittal?", it: "Assoluzione apparente?" } },
    { s: { en: "The Painter", it: "Il Pittore" }, t: { en: "You are acquitted — until some official looks at the file again on a bad morning. The file never dies; it only sleeps in a drawer that breathes.", it: "Lei viene assolto — finché qualche funzionario non riapre il fascicolo in una brutta mattina. Il fascicolo non muore mai; dorme soltanto in un cassetto che respira." } }
  ],
  choices: [
    { text: { en: "Take the long game: indefinite postponement.", it: "Scegli il gioco lungo: il rinvio indefinito." }, lines: [
      { s: { en: "The Painter", it: "Il Pittore" }, t: { en: "Prudent. The file never advances, and neither do you — but it cannot condemn what it cannot finish. You will carry it like a stone in your coat, and learn to walk straighter than most free men.", it: "Prudente. Il fascicolo non avanza, e lei nemmeno — ma non può condannare ciò che non riesce a finire. Lo porterà come un sasso nel cappotto, e imparerà a camminare più dritto della maggior parte degli uomini liberi." } }
    ] },
    { text: { en: "Reject all three doors and keep struggling publicly.", it: "Rifiuta tutte e tre le porte e continua a lottare in pubblico." }, lines: [
      { s: { en: "The Painter", it: "Il Pittore" }, t: { en: "Struggle is a fourth door that is painted on the wall. But open it anyway — every trial needs its example, and the Court learns from men like you. So do I; I will paint you with the light coming from the wrong side.", it: "La lotta è una quarta porta dipinta sul muro. Ma la apra lo stesso — ogni processo ha bisogno del suo esempio, e la Corte impara dagli uomini come lei. Anch'io; la ritrarrò con la luce che arriva dal lato sbagliato." } }
    ] }
  ],
  outro: { en: "In the attic, even the windows face other attics.", it: "Nel sottotetto, perfino le finestre danno su altri sottotetti." }
});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PIXEL CUP '96 — low-poly arcade football</title>
  <meta name="description" content="PIXEL CUP '96 is a free pixel-art, low-poly arcade football game in the browser. Five a side, ninety seconds a half, a cup to win and a penalty shoot-out to settle. Installable and works offline.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PIXEL CUP '96">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PIXEL CUP '96">
  <meta property="og:title" content="PIXEL CUP '96 — low-poly arcade football">
  <meta property="og:description" content="A pixel-art, low-poly arcade football game. Five a side, ninety seconds a half, a cup to win. Plays offline.">
  <meta property="og:url" content="https://lucagandolfi77.github.io/random2/pixel-cup-pwa/">
  <meta property="og:image" content="https://lucagandolfi77.github.io/random2/pixel-cup-pwa/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "PIXEL CUP '96",
    "alternateName": "Pixel Cup",
    "url": "https://lucagandolfi77.github.io/random2/pixel-cup-pwa/",
    "description": "A pixel-art, low-poly arcade football game in the browser: five a side, ninety seconds a half, a knockout cup and a penalty shoot-out. Installable and fully offline.",
    "genre": ["Sport", "Arcade", "Simulation"],
    "gamePlatform": "Web browser",
    "playMode": "SinglePlayer",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any modern browser",
    "inLanguage": "en",
    "isAccessibleForFree": true,
    "author": { "@type": "Person", "name": "Luca Gandolfi" },
    "publisher": { "@type": "Person", "name": "Luca Gandolfi" },
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "availability": "https://schema.org/InStock" }
  }
  </script>
</head>
<body>
  <main id="app">
    <div id="stage">
      <canvas id="game" width="320" height="180" role="img"
              aria-label="A low-poly football pitch seen from behind the attacking team. The scoreboard is at the top of the screen."></canvas>
      <button id="pause-btn" class="iconbtn" type="button" aria-label="Pause the match">&#10073;&#10073;</button>
    </div>

    <div id="screen" class="screen" aria-hidden="true"></div>

    <div id="touch" class="touch" aria-hidden="true">
      <div id="stick-base" class="stick-base">
        <div id="stick" class="stick"></div>
      </div>
      <div class="pads">
        <button class="pad pad-skill" data-btn="skill" type="button" tabindex="-1">SKILL</button>
        <button class="pad pad-pass" data-btn="pass" type="button" tabindex="-1">PASS</button>
        <button class="pad pad-shoot" data-btn="shoot" type="button" tabindex="-1">SHOOT</button>
        <button class="pad pad-switch" data-btn="switch" type="button" tabindex="-1">SWAP</button>
        <button class="pad pad-sprint" data-btn="sprint" type="button" tabindex="-1">RUN</button>
      </div>
    </div>

    <p id="live" class="visually-hidden" aria-live="polite" role="status"></p>

    <footer class="helpbar">
      <span><b>WASD</b> move</span>
      <span><b>Space</b> pass</span>
      <span><b>J</b> shoot</span>
      <span><b>Shift</b> sprint</span>
      <span><b>Q</b> swap</span>
      <span><b>L</b> skill</span>
    </footer>
  </main>

  <script src="../shared/arcade.js"></script>
  <script src="src/core.js"></script>
  <script src="src/raster.js"></script>
  <script src="src/font.js"></script>
  <script src="src/render.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>

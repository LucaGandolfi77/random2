  <h1 class="ls-heading">Anna Karenina — Act II</h1>

<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "The Race", it: "La corsa" },
  place: { en: "The Moscow racecourse", it: "L'ippodromo di Mosca" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "The officers' race at the Moscow course. Vronsky rides Gladiator — one stride behind, one heartbeat ahead of himself.", it: "La corsa degli ufficiali all'ippodromo di Mosca. Vronskij monta Gladiator — un passo dietro, un battito davanti a se stesso." } },
    { s: "Anna", t: { en: "I should not have come. I am visible; the opera glasses of a whole society are aimed at my face.", it: "Non dovevo venire. Sono visibile; i binocoli da opera di un'intera società sono puntati sul mio volto." } },
    { s: "Karenin", t: { en: "You are pale. Your eyes follow the rider who is not your husband, and every lorgnette in the stand follows you.", it: "Sei pallida. I tuoi occhi seguono il fantino che non è tuo marito, e ogni lorgnette del palco segue te." } },
    { s: "Anna", t: { en: "Then let them look. For one hour today, Alexei Alexandrovich, I am not a wife, not a mother, not a name on a visiting card. I am only a heartbeat in a crowd.", it: "E allora guardino. Per un'ora, oggi, Aleksej Aleksandrovic, non sono una moglie, non sono una madre, non sono un nome su un biglietto da visita. Sono soltanto un battito in mezzo alla folla." } },
    { s: N, t: { en: "The third hurdle: Gladiator's back breaks like a branch under snow. The horse falls; the rider is — up, limping, alive. The stands exhale. One woman cannot.", it: "Il terzo ostacolo: la schiena di Gladiator si spezza come un ramo sotto la neve. Il cavallo cade; il fantino è — in piedi, zoppicando, vivo. La tribuna riprende fiato. Una donna no." } },
    { s: "Anna", t: { en: "He lives. God, what a terrible thing to be glad of — I was glad the fall was not his end, and ashamed that the fall was his.", it: "Vive. Dio, che cosa terribile da esser lieti — ero lieta che la caduta non fosse la sua fine, e in vergogna che la caduta fosse sua." } },
    { s: "Karenin", t: { en: "Compose yourself. People are looking. This display of feeling is — irregular.", it: "Componiti. La gente guarda. Questa esposizione di sentimenti è — irregolare." } },
    { s: "Anna", t: { en: "Irregular. Yes. That word is my whole life, Alexei Alexandrovich, and I begin to prefer it to yours.", it: "Irregolare. Sì. Quella parola è tutta la mia vita, Aleksej Aleksandrovic, e comincio a preferirla alla tua." } }
  ],
  choices: [
    { text: { en: "Tell Karenin the truth tonight, in the carriage.", it: "Dì la verità a Karenin stanotte, in carrozza." }, lines: [
      { s: N, t: { en: "The carriage lamps cut two small cones of light. She says the word 'love' and he hears 'scandal'. He answers with a memorandum of society's rules and asks for seven days' silence. The sentence of the family court is drafted in that silence, unsigned.", it: "I fanali della carrozza tagliano due piccoli coni di luce. Lei dice la parola «amore» e lui sente «scandalo». Risponde con un memoriale delle regole della società e chiede sette giorni di silenzio. La sentenza del tribunale di famiglia viene redatta in quel silenzio, senza firma." } }
    ] },
    { text: { en: "Keep the wall standing a season longer.", it: "Tieni in piedi il muro ancora una stagione." }, lines: [
      { s: N, t: { en: "The wall holds, and each of them stations a sentry on it — she of glances, he of principle. The child inside her will be born into a war he did not choose, and the race will run again every season, faster.", it: "Il muro tiene, e ciascuno dei due vi posta una sentinella — lei di sguardi, lui di principio. Il figlio che porta in grembo nascerà in una guerra che non ha scelto, e la corsa correrà ancora ogni stagione, più veloce." } }
    ] }
  ],
  outro: { en: "A society watches the race and pretends not to see the woman.", it: "La società guarda la corsa e finge di non vedere la donna." }
});
</script>

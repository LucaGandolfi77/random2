<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MADRE — Casa di fermentazione</title>
  <meta name="description" content="Tycoon della fermentazione: le curve di maturazione seguono il tempo reale, anche a app chiusa. Vendere al picco o dimenticare e far marcire.">
  <meta name="theme-color" content="#8a6d3b">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MADRE">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <span class="chip money">€ <b id="money">60</b></span>
        <span class="chip">⭐ <b id="rep">50</b></span>
        <span class="chip" id="daychip">Giornata 1</span>
      </div>
      <div class="hud-right">
        <button id="notify-btn" class="iconbtn" aria-label="Notifiche">🔔</button>
        <button id="help-btn" class="iconbtn" aria-label="Aiuto">❓</button>
        <button id="sound-btn" class="iconbtn" aria-label="Audio">🔊</button>
      </div>
    </header>

    <nav id="tabs">
      <button class="tab sel" data-tab="cantina">🍾 Cantina</button>
      <button class="tab" data-tab="contratti">📜 Contratti <em id="cbadge" class="hidden">0</em></button>
      <button class="tab" data-tab="mercato">📈 Mercato</button>
    </nav>

    <main id="view"></main>

    <div id="modal" class="overlay hidden">
      <div class="sheet">
        <h2 id="m-title"></h2>
        <div id="m-body" class="body"></div>
        <div id="m-btns"></div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>
  <script src="../shared/arcade.js"></script>
  <script src="game.js"></script>
</body>
</html>

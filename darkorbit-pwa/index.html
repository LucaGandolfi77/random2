<!DOCTYPE html>
<html lang="en" data-theme="deep">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Deep Orbit — Space Combat</title>
    <meta name="description" content="A mobile, offline-first space combat game: fly a ship, hunt aliens, haul ore, upgrade and jump deeper.">
    <meta name="theme-color" content="#06111f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Deep Orbit">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body data-phase="menu">
    <div id="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">◈</span>
                <h1>DEEP ORBIT</h1>
            </div>
            <div class="hud-top">
                <div class="hud-cell"><span>LVL</span><b id="hud-level">1</b></div>
                <div class="hud-cell credits"><span>CR</span><b id="hud-credits">0</b></div>
                <div class="hud-cell urium"><span>U</span><b id="hud-urium">0</b></div>
                <div class="hud-cell sector"><span>SECTOR</span><b id="hud-map">ALPHA SECTOR</b></div>
                <button id="btn-pause" class="icon-btn" type="button" aria-label="Pause game">⏸</button>
            </div>
            <div id="xp-track" class="xp-track"><div id="xp-fill" class="xp-fill"></div></div>
        </header>

        <main class="stage" id="stage">
            <canvas id="game-canvas" width="800" height="600" tabindex="0" aria-label="Deep Orbit playfield"></canvas>

            <div id="phase-label" class="phase-label">SECTOR ACTIVE</div>

            <div id="gate-hud" class="gate-hud hidden" role="status">
                <span class="gate-title">GALAXY GATE</span>
                <span id="gate-wave" class="gate-wave">WAVE 1 / 3</span>
                <span id="gate-time" class="gate-time">1:30</span>
                <span id="gate-kills" class="gate-kills">0 / 4</span>
                <div class="gate-track"><div id="gate-fill"></div></div>
            </div>

            <div id="safe-badge" class="safe-badge hidden" role="status">🛡 SAFE ZONE · WEAPONS LOCKED</div>

            <div id="active-effects" class="active-effects" aria-label="Active effects"></div>

            <canvas id="minimap" width="140" height="140" aria-label="Radar"></canvas>

            <div id="target-panel" class="target-panel hidden">
                <span id="target-name">TARGET</span>
                <div class="mini-track"><div id="target-shield-fill" class="shield"></div></div>
                <div class="mini-track"><div id="target-hp-fill" class="hp"></div></div>
            </div>

            <div id="toast-area" class="toast-area" aria-hidden="true"></div>

            <div id="ship-status" class="ship-status">
                <div class="bar-row"><span>SHD</span><div class="track"><div id="shield-fill" class="shield"></div></div><small id="shield-text">0 / 0</small></div>
                <div class="bar-row"><span>HULL</span><div class="track"><div id="hp-fill" class="hp"></div></div><small id="hp-text">0 / 0</small></div>
                <div class="bar-row"><span>CARGO</span><div class="track"><div id="cargo-fill" class="cargo"></div></div><small id="cargo-text">0 / 0</small></div>
            </div>

            <div class="context-actions">
                <button id="btn-gate" class="btn tiny hidden" type="button">⚡ LAUNCH GATE</button>
                <button id="btn-dock" class="btn tiny hidden" type="button">E · DOCK / SELL</button>
                <button id="btn-jump" class="btn tiny hidden" type="button">J · JUMP</button>
                <button id="btn-hangar" class="btn tiny hidden" type="button">⚙ HANGAR</button>
            </div>

            <div class="controls">
                <div id="joystick" class="joystick" aria-label="Movement joystick">
                    <div class="joystick-ring" aria-hidden="true"></div>
                    <div id="joystick-knob" class="joystick-knob" aria-hidden="true"></div>
                </div>
                <div class="action-cluster">
                    <div class="abilities">
                        <button class="ability" data-ability="boost" type="button" aria-label="Afterburner"><span class="glyph">»</span><small>BOOST</small><div class="cd-mask"></div></button>
                        <button class="ability" data-ability="barrier" type="button" aria-label="Insta-Shield"><span class="glyph">⬡</span><small>SHIELD</small><div class="cd-mask"></div></button>
                        <button class="ability" data-ability="repair" type="button" aria-label="Nano Repair"><span class="glyph">+</span><small>REPAIR</small><div class="cd-mask"></div></button>
                    </div>
                    <button id="ammo-btn" class="ammo-btn" type="button" aria-label="Change ammo"><span id="ammo-tag" class="ammo-tag">X4</span><small id="ammo-name">UCB-100</small></button>
                    <button id="fire-btn" class="fire-btn" type="button" aria-label="Fire lasers"><span class="fire-core">◉</span><small>FIRE</small></button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <span id="hint">JOYSTICK TO FLY · HOLD FIRE · TAP TO LOCK</span>
            <span class="score-line"><b id="hud-score">0</b> PTS · <b id="hud-kills">0</b> KILLS</span>
        </footer>

        <div id="coach" class="coach hidden" role="dialog" aria-modal="true">
            <div class="coach-card">
                <span id="coach-target" class="coach-step">1 / 3</span>
                <p id="coach-text">Drag to fly</p>
                <div class="panel-actions">
                    <button class="btn tiny" data-action="coach-skip" type="button">SKIP</button>
                    <button class="btn tiny primary" data-action="coach-next" type="button">GOT IT</button>
                </div>
            </div>
        </div>

        <div id="debug-hud" class="debug-hud hidden" aria-hidden="true"></div>

        <div id="overlay" class="overlay hidden"></div>

        <div id="install-prompt" class="install-prompt hidden" role="status">
            <p>Install Deep Orbit for offline play?</p>
            <div class="install-actions">
                <button id="install-btn" class="btn primary" type="button">INSTALL</button>
                <button id="install-later" class="btn" type="button">LATER</button>
            </div>
        </div>

        <div id="sr-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>

    <noscript>
        <p class="noscript">Deep Orbit needs JavaScript. Enable it and reload the page.</p>
    </noscript>

    <script src="../shared/arcade.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>

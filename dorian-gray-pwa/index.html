  <h1 class="ls-heading">The Picture of Dorian Gray — Act II</h1>
  <p class="ls-sub">The story continues from the scene that begins in the anthology. In English and Italian.</p>
  <div id="scene"></div>
  <div class="ls-foot"><a href="../anthology-pwa/">← The Library — La Biblioteca</a></div>

<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "The Confession of Basil", it: "La confessione di Basil" },
  place: { en: "The locked schoolroom, years later", it: "La scuola chiusa a chiave, anni dopo" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "Thirty-eight years old, and the mirrors still flatter a boy of twenty. Upstairs, under the sheet, something has grown old for two.", it: "Trentotto anni, e gli specchi adulano ancora un ragazzo di vent'anni. Al piano di sopra, sotto il lenzuolo, qualcosa è invecchiato per due." } },
    { s: "Basil", t: { en: "Before I leave for Paris, Dorian, show me the picture. I ask as the man who made you twice — once of paint, once of fear.", it: "Prima di partire per Parigi, Dorian, mostrami il quadro. Te lo chiedo come l'uomo che ti ha fatto due volte — una volta di vernice, una volta di paura." } },
    { s: "Dorian", t: { en: "You would not recognize it. Some nights I do not. There is a smile on it I never wore; there are hands on it I never washed.", it: "Non lo riconosceresti. Qualche notte non lo riconosco nemmeno io. C'è un sorriso che non ho mai portato; ci sono mani che non ho mai lavato." } },
    { s: "Basil", t: { en: "Then it is worse than a portrait. It is a ledger. Show me, and let me pray over it — over you.", it: "Allora è peggio di un ritratto. È un registro contabile. Mostramelo, e lasciami pregare su di esso — su di te." } },
    { s: N, t: { en: "The sheet comes off. Basil, who painted every saint with the same calm light, steps back as if the room had tilted.", it: "Il lenzuolo cade. Basil, che ha dipinto ogni santo con la stessa luce calma, fa un passo indietro come se la stanza si fosse inclinata." } },
    { s: "Basil", t: { en: "Christ, what a face! It has your eyes and a stranger's crimes. Dorian — if this is true, then prayer can still reach you. 'Though your sins be as scarlet…'", it: "Cristo, che volto! Ha i tuoi occhi e i delitti di un estraneo. Dorian — se questo è vero, allora la preghiera può ancora raggiungerti. «Anche se i vostri peccati fossero come scarlatto…»" } },
    { s: "Dorian", t: { en: "Do not quote the ivory book at me, Basil. You see the ledger; he taught me the interest. It was you who painted a wish into a soul.", it: "Non citarmi il libro d'avorio, Basil. Tu vedi il registro; lui mi ha insegnato gli interessi. Sei stato tu a dipingere un desiderio dentro un'anima." } },
    { s: "Basil", t: { en: "Then let me paint it back. One more canvas, on my knees, and we hang this one where only God audits it.", it: "Allora lasciami dipingerlo indietro. Un'altra tela, in ginocchio, e quest'ultima la appendiamo dove la controlla solo Dio." } }
  ],
  choices: [
    { text: { en: "Let Basil pray over the portrait — one night.", it: "Lascia che Basil preghi sul ritratto — una notte." }, lines: [
      { s: N, t: { en: "They kneel together in the schoolroom, the young face and the old one lit by the same candle. Nothing visibly changes. But Dorian sleeps, and the smile on the canvas is, by one line, less cruel. Ledgers can be softened; few know they can.", it: "Inginoocchiati insieme nella scuola, il volto giovane e il vecchio accesi dalla stessa candela. Nulla cambia visibilmente. Però Dorian dorme, e il sorriso sulla tela è, di una linea, meno crudele. I registri si possono addolcire; in pochi lo sanno." } }
    ] },
    { text: { en: "Show him the door — the knife stays where it is, for now.", it: "Mostragli la porta — il coltello resta dov'è, per ora." }, lines: [
      { s: N, t: { en: "Basil leaves with his prayer refused and his paints packed. In Paris he will be safe; in this house the sheet goes back over the canvas, and the house grows one room darker. The knife stays in the drawer — an omen with a handle.", it: "Basil se ne va con la preghiera rifiutata e le tempere imballate. A Parigi sarà al sicuro; in questa casa il lenzuolo torna sulla tela, e la casa diventa più buia di una stanza. Il coltello resta nel cassetto — un presagio con il manico." } }
    ] }
  ],
  outro: { en: "Every portrait is an unfinished argument with its sitter.", it: "Ogni ritratto è una lite incompiuta col proprio modello." }
});
</script>

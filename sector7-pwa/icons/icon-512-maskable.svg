<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b33"/>
      <stop offset="55%" stop-color="#071122"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>
    <linearGradient id="hullTopM" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hullSideM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0a4a63"/>
    </linearGradient>
    <linearGradient id="wingM" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="engineM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffb347" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#1e5f7a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full bleed: a maskable icon is cropped by the launcher to whatever
       shape it likes, so there is no rounded rect and the art is pulled in
       to the inner 80% safe zone. -->
  <rect width="512" height="512" fill="url(#skyM)"/>
  <circle cx="256" cy="266" r="215" fill="url(#glowM)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="92" r="2.2" opacity=".9"/>
    <circle cx="140" cy="60" r="1.4" opacity=".5"/>
    <circle cx="330" cy="78" r="2" opacity=".8"/>
    <circle cx="446" cy="118" r="1.4" opacity=".5"/>
    <circle cx="62" cy="392" r="1.8" opacity=".65"/>
    <circle cx="448" cy="380" r="1.6" opacity=".55"/>
    <circle cx="112" cy="444" r="2" opacity=".75"/>
    <circle cx="404" cy="440" r="1.5" opacity=".5"/>
  </g>

  <g transform="translate(256 268) scale(0.66)">
    <ellipse cx="-60" cy="68" rx="86" ry="52" fill="url(#engineM)"/>

    <g transform="translate(0 -6) rotate(-40)">
      <polygon points="40,14 -20,98 8,86 44,28" fill="#0b4a5e"/>
      <polygon points="-80,-20 58,-20 100,0 58,20 -80,20 -90,0" fill="url(#hullSideM)"/>
      <polygon points="-80,-20 58,-20 100,0 16,0 -90,0" fill="#0891b2" opacity=".6"/>
      <polygon points="58,-20 100,0 58,20" fill="#67e8f9"/>
      <polygon points="40,-16 -20,-98 8,-86 44,-28" fill="url(#wingM)"/>
      <polygon points="40,-16 -20,-98 -10,-94 36,-25" fill="#a5f3fc" opacity=".3"/>
      <polygon points="12,-10 48,-5 48,5 12,10" fill="#cffafe"/>
      <polygon points="-80,-20 -92,0 -80,20 -86,0" fill="#0b3b4d"/>
      <circle cx="-88" cy="0" r="10" fill="#ffd166"/>
    </g>

    <g transform="translate(-128 128)">
      <polygon points="0,-34 14,-8 34,0 14,8 0,34 -14,8 -34,0 -14,-8" fill="#ffd166" opacity=".9"/>
      <polygon points="0,-20 8,-5 20,0 8,5 0,20 -8,5 -20,0 -8,-5" fill="#fff3c4"/>
    </g>

    <g transform="translate(138 -116)">
      <polygon points="0,-30 20,0 0,30 -20,0" fill="#7dd3fc"/>
      <polygon points="0,-30 20,0 0,0 -20,0" fill="#bae6fd"/>
      <polygon points="0,30 20,0 0,0 -20,0" fill="#38bdf8" opacity=".7"/>
    </g>
  </g>
</svg>
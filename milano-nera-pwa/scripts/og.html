<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MILANO NERA '77 — social card</title>
<style>
  :root {
    --ink: #f1e4c8;
    --muted: #b8a78e;
    --red: #c84436;
    --gold: #e0b35c;
    --display: Impact, "Arial Narrow", "Avenir Next Condensed", sans-serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body {
    position: relative;
    color: var(--ink);
    font-family: var(--body);
    background:
      radial-gradient(circle at 78% 22%, rgba(224, 179, 92, .16), transparent 28%),
      radial-gradient(circle at 22% 78%, rgba(200, 68, 54, .16), transparent 38%),
      linear-gradient(130deg, #08080b 0%, #1d0e13 48%, #4a1b1e 100%);
  }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 52% 42%, transparent 38%, rgba(0, 0, 0, .58) 100%);
  }
  .copy { position: absolute; left: 78px; top: 62px; width: 700px; z-index: 2; }
  .eyebrow {
    margin: 0 0 8px;
    color: var(--gold);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .34em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-size: 172px;
    font-weight: 400;
    line-height: .71;
    letter-spacing: .015em;
    text-transform: uppercase;
    text-shadow: 0 18px 60px rgba(0, 0, 0, .65);
  }
  h1 span { display: block; }
  h1 span:last-child {
    background: linear-gradient(100deg, #f1d184 0%, #c84436 48%, #f1d184 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin: 23px 0 0;
    color: var(--muted);
    font-size: 23px;
    line-height: 1.4;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tags span {
    padding: 7px 12px;
    border: 1px solid rgba(241, 228, 200, .18);
    border-radius: 3px;
    background: rgba(255, 255, 255, .05);
    color: #e8d9bd;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .tags span:first-child {
    border-color: rgba(224, 179, 92, .55);
    background: rgba(224, 179, 92, .12);
    color: var(--gold);
  }
  .icon-card {
    position: absolute;
    top: 190px;
    right: 105px;
    z-index: 3;
    width: 290px;
    height: 290px;
    border-radius: 48px;
    border: 1px solid rgba(241, 228, 200, .2);
    box-shadow: 0 36px 90px rgba(0, 0, 0, .65), 0 0 70px rgba(200, 68, 54, .22);
    transform: rotate(4deg);
    overflow: hidden;
  }
  .icon-card img { display: block; width: 100%; height: 100%; }
  .stamp {
    position: absolute;
    right: 105px;
    bottom: 55px;
    z-index: 3;
    width: 300px;
    color: rgba(241, 228, 200, .5);
    font-size: 9px;
    letter-spacing: .22em;
    text-align: center;
    text-transform: uppercase;
  }
  .footer {
    position: absolute;
    left: 80px;
    bottom: 46px;
    z-index: 2;
    color: rgba(241, 228, 200, .42);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .footer strong { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
  <svg class="scene" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#08080b"/>
        <stop offset=".66" stop-color="#241218"/>
        <stop offset="1" stop-color="#4b1d20"/>
      </linearGradient>
      <radialGradient id="moonGlow">
        <stop offset="0" stop-color="#f1d58c" stop-opacity=".34"/>
        <stop offset="1" stop-color="#f1d58c" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#sky)"/>
    <circle cx="900" cy="134" r="210" fill="url(#moonGlow)"/>
    <circle cx="900" cy="134" r="70" fill="#f2d994"/>
    <circle cx="878" cy="112" r="12" fill="#4b1d20" opacity=".14"/>
    <g fill="#f1e4c8" opacity=".18">
      <circle cx="122" cy="80" r="2"/>
      <circle cx="308" cy="124" r="1.4"/>
      <circle cx="540" cy="62" r="1.6"/>
      <circle cx="708" cy="174" r="1.2"/>
      <circle cx="1088" cy="224" r="1.6"/>
      <circle cx="100" cy="270" r="1.2"/>
    </g>
    <path d="M0 452 L128 390 L238 420 L356 356 L480 414 L598 372 L732 430 L850 386 L968 434 L1100 390 L1200 424 L1200 630 L0 630Z" fill="#100d12" opacity=".9"/>
    <g fill="#0b0910">
      <path d="M390 500V306l43-34 31 48 47-94 48 101 38-58 48 65 36-45 42 62 39-40 40 66v132z"/>
      <path d="M424 306l20-72 16 72zM508 275l24-90 25 90zM600 286l20-78 20 78zM684 278l25-82 25 82zM770 282l22-70 22 70z"/>
    </g>
    <g stroke="#d4b266" stroke-width="3" opacity=".45">
      <path d="M520 246v-60M620 252v-56M720 248v-54M820 250v-54"/>
    </g>
    <path d="M0 512h1200v118H0z" fill="#171114"/>
    <path d="M0 550h1200M0 600h1200" stroke="#090708" stroke-width="3"/>
    <g fill="#c84436" opacity=".6">
      <rect x="90" y="486" width="72" height="10"/>
      <rect x="904" y="500" width="108" height="8"/>
      <rect x="1030" y="480" width="50" height="7"/>
    </g>
    <g fill="#e0b35c" opacity=".7">
      <rect x="240" y="486" width="3" height="22"/>
      <rect x="1010" y="466" width="3" height="30"/>
    </g>
    <g transform="translate(900 500)">
      <path d="M-42 0h84l-12-40h-60z" fill="#161217"/>
      <path d="M-24-40h48v-12h-48z" fill="#21191c"/>
      <rect x="-32" y="-8" width="8" height="5" fill="#e0b35c"/>
      <rect x="24" y="-8" width="8" height="5" fill="#e0b35c"/>
    </g>
  </svg>
  <div class="vignette"></div>
  <div class="copy">
    <p class="eyebrow">Milano, 1977 · Una notte di piombo</p>
    <h1><span>Milano</span><span>Nera '77</span></h1>
    <p class="tagline">Un ex detenuto. Una pistola.<br>Una città che mente.</p>
    <div class="tags">
      <span>Twin-stick noir</span>
      <span>Stealth</span>
      <span>Cover</span>
      <span>Ricochet</span>
      <span>Gratis nel browser</span>
    </div>
  </div>
  <div class="icon-card"><img src="../icons/icon.svg" alt=""></div>
  <p class="stamp">Sei capitoli · boss · inseguimenti</p>
  <p class="footer"><strong>Milano Nera '77</strong> · gioca ora</p>
</body>
</html>

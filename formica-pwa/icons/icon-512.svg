<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wood" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#9c7a50"/>
      <stop offset="55%" stop-color="#7d5f3d"/>
      <stop offset="100%" stop-color="#5a4228"/>
    </linearGradient>
    <linearGradient id="ant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a50"/>
      <stop offset="100%" stop-color="#e05118"/>
    </linearGradient>
    <linearGradient id="trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7043" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ff7043" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#wood)"/>

    <!-- grana del legno -->
    <g stroke="#4a341f" stroke-opacity="0.35" fill="none" stroke-linecap="round">
      <path d="M0 90 Q 128 74 256 92 T 512 84" stroke-width="7"/>
      <path d="M0 150 Q 160 138 300 154 T 512 146" stroke-width="5"/>
      <path d="M0 230 Q 140 214 280 232 T 512 222" stroke-width="6"/>
      <path d="M0 320 Q 180 306 320 322 T 512 314" stroke-width="7"/>
      <path d="M0 400 Q 130 386 260 402 T 512 394" stroke-width="5"/>
      <path d="M0 462 Q 170 450 330 464 T 512 456" stroke-width="6"/>
    </g>
    <g fill="#3c2a17" fill-opacity="0.4">
      <ellipse cx="96" cy="190" rx="26" ry="11"/>
      <ellipse cx="96" cy="190" rx="15" ry="6"/>
      <ellipse cx="96" cy="190" rx="6" ry="2.5"/>
      <ellipse cx="420" cy="340" rx="30" ry="13"/>
      <ellipse cx="420" cy="340" rx="17" ry="7"/>
      <ellipse cx="420" cy="340" rx="7" ry="3"/>
    </g>

    <!-- scia di feromoni -->
    <path d="M120 430 C 190 420 150 330 230 320 C 320 309 300 220 380 210"
          fill="none" stroke="url(#trail)" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
    <path d="M120 430 C 190 420 150 330 230 320 C 320 309 300 220 380 210"
          fill="none" stroke="#ffca82" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

    <!-- formica grande -->
    <g transform="translate(330 195) rotate(-38)">
      <!-- zampe -->
      <g stroke="#7a2a08" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M-6 -10 L -26 -34"/><path d="M-6 10 L -26 34"/>
        <path d="M2 -10 L -14 -40"/><path d="M2 10 L -14 40"/>
        <path d="M10 -10 L 0 -42"/><path d="M10 10 L 0 42"/>
      </g>
      <!-- antenne -->
      <g stroke="#7a2a08" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M42 -6 Q 62 -20 70 -34"/>
        <path d="M42 6 Q 62 20 70 34"/>
      </g>
      <!-- corpo: addome, torace, testa -->
      <ellipse cx="-28" cy="0" rx="34" ry="24" fill="url(#ant)"/>
      <ellipse cx="2" cy="0" rx="18" ry="13" fill="#f4632a"/>
      <ellipse cx="32" cy="0" rx="17" ry="13" fill="#ff8a50"/>
      <ellipse cx="36" cy="-3" rx="5" ry="3.5" fill="#ffe3c2" opacity="0.8"/>
    </g>

    <!-- briciole -->
    <g fill="#c9a26b">
      <circle cx="150" cy="120" r="9"/>
      <circle cx="168" cy="132" r="6"/>
      <circle cx="404" cy="120" r="7"/>
      <circle cx="120" cy="470" r="8"/>
    </g>
    <!-- zucchero -->
    <g fill="#f5f0e1">
      <path d="M210 90 l7 7 -7 7 -7 -7 z"/>
      <path d="M452 440 l6 6 -6 6 -6 -6 z"/>
    </g>
  </g>
</svg>

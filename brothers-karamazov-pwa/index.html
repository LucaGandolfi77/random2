  <h1 class="ls-heading">The Brothers Karamazov — Act II</h1>
  <p class="ls-sub">The story continues from the scene that begins in the anthology. In English and Italian.</p>
  <div id="scene"></div>
  <div class="ls-foot"><a href="../anthology-pwa/">← The Library — La Biblioteca</a></div>

<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "The Cana of Galilee", it: "Le nozze di Cana" },
  place: { en: "The monastery, the night after the elder's death", it: "Il monastero, la notte dopo la morte dell'anziano" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "Father Zosima has been dead three days, and the monastery whispers: the body of a righteous man should smell of sanctity. It smells of ordinary death.", it: "Padre Zosima è morto da tre giorni, e il monastero mormora: il corpo di un giusto dovrebbe odorare di santità. Odora di morte comune." } },
    { s: { en: "Voices", it: "Le Voci" }, t: { en: "He fasted, he prayed — and look at him. Perhaps he was not righteous after all.", it: "Ha digiunato, ha pregato — e guardate. Forse non era affatto un giusto." } },
    { s: "Alyosha", t: { en: "Ivan is smiling. My brother the logician heard the whisper, and smiled.", it: "Ivan sorride. Mio fratello il logico ha sentito il mormorio, e sorride." } },
    { s: "Ivan", t: { en: "One miracle is worth a thousand arguments, Alyosha. And one odour is worth a thousand miracles. Good night, little brother.", it: "Un miracolo vale mille argomenti, Alëša. E un odore vale mille miracoli. Buonanotte, fratellino." } },
    { s: N, t: { en: "Alyosha keeps vigil alone, the Gospel open, the candle down to its last hour. 'And there was a marriage in Cana of Galilee…'", it: "Alëša veglia da solo, il Vangelo aperto, la candela ridotta alla sua ultima ora. «E si fecero le nozze in Cana di Galilea…»" } },
    { s: "Alyosha", t: { en: "He was at the marriage. He was at the feast. Why am I not weeping — why do I want to dance?", it: "Lui era alle nozze. Era al banchetto. Perché non sto piangendo — perché mi viene da ballare?" } },
    { s: N, t: { en: "The dream comes like warm water: the feast of Cana, and the old elder among the poor guests, laughing, calling him: 'Why have you gone away, Alyosha?'", it: "Il sogno arriva come acqua tiepida: il banchetto di Cana, e il vecchio anziano tra gli ospiti poveri, che ride e lo chiama: «Perché te ne sei andato, Alëša?»" } },
    { s: { en: "Father Zosima", it: "Padre Zosima" }, t: { en: "We are not separated, my quiet boy. Run out and rejoice — do not fear life. Life is greater than the meaning of it.", it: "Non siamo separati, mio ragazzo silenzioso. Corri fuori e rallegrati — non temere la vita. La vita è più grande del suo significato." } },
    { s: N, t: { en: "Alyosha wakes, goes out, falls to the earth, kisses it, weeps and laughs at once. A soldier-boy runs up to ask for alms and receives the whole night's joy.", it: "Alëša si sveglia, esce, cade a terra, la bacia, piange e ride insieme. Un giovanotto soldato gli corre incontro a chiedere l'elemosina e riceve tutta la gioia della notte." } }
  ],
  choices: [
    { text: { en: "Carry the joy back to the brothers tomorrow.", it: "Riporta la gioia ai fratelli, domani." }, lines: [
      { s: N, t: { en: "In the morning he will make peace at the funeral, feed the boys, and hold the monastery and the town together with a thread of quiet gladness. Grief kept company becomes bread.", it: "La mattina farà pace ai funerali, sfamerà i ragazzi, e terrà insieme monastero e città con un filo di letizia tranquilla. Il dolore in compagnia diventa pane." } }
    ] },
    { text: { en: "Go at once to Ivan — joy is strongest shared with the doubter.", it: "Vai subito da Ivan — la gioia è più forte se condivisa col dubitante." }, lines: [
      { s: N, t: { en: "He finds Ivan asleep over Lermontov, notes on theodicy in the margins. Alyosha lays a blanket over him and prays for the argument he cannot yet win. The joy keeps; the argument will keep longer.", it: "Lo trova addormentato sopra Lermontov, appunti sulla teodicea a margine. Alëša gli stende una coperta e prega per l'argomento che non può ancora vincere. La gioia si conserva; l'argomento si conserva di più." } }
    ] }
  ],
  outro: { en: "Do not fear life. That is the whole gospel, read at a funeral.", it: "Non temere la vita. È tutto il vangelo, letto a un funerale." }
});
</script>

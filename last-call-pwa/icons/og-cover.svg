    <path d="M0 538 L1200 538"/><path d="M0 552 L1200 552"/>
  </g>

  <!-- sunburst behind the glass -->
  <g opacity=".13" stroke="url(#gold)" stroke-width="2">
    <line x1="868" y1="308" x2="1328" y2="308"/><line x1="868" y1="308" x2="1266" y2="538"/><line x1="868" y1="308" x2="1098" y2="706"/><line x1="868" y1="308" x2="868" y2="768"/><line x1="868" y1="308" x2="638" y2="706"/><line x1="868" y1="308" x2="470" y2="538"/><line x1="868" y1="308" x2="408" y2="308"/><line x1="868" y1="308" x2="470" y2="78"/><line x1="868" y1="308" x2="638" y2="-90"/><line x1="868" y1="308" x2="868" y2="-152"/><line x1="868" y1="308" x2="1098" y2="-90"/><line x1="868" y1="308" x2="1266" y2="78"/>
  </g>
  <circle cx="868" cy="308" r="238" fill="none" stroke="url(#gold)" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="868" cy="308" r="218" fill="none" stroke="url(#gold)" stroke-opacity=".16" stroke-width="1" stroke-dasharray="4 10"/>

  <!-- text block -->
  <text x="86" y="134" fill="#e7bd6b" font-family="Optima, 'Avenir Next', sans-serif"

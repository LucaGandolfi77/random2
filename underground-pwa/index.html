  <h1 class="ls-heading">Notes from Underground — Act II</h1>
  <p class="ls-sub">The story continues from the scene that begins in the anthology. In English and Italian.</p>
  <div id="scene"></div>
  <div class="ls-foot"><a href="../anthology-pwa/">← The Library — La Biblioteca</a></div>

<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
var U = { en: "Underground Man", it: "L'uomo del sottosuolo" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "Liza", it: "Liza" },
  place: { en: "A corner room, two weeks later", it: "Una stanza d'angolo, due settimane dopo" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "Two weeks after the billiard hall, she comes. A prostitute with a green shawl and eyes that have decided something. He had bet money she would not.", it: "Due settimane dopo il biliardo, lei viene. Una prostituta con uno scialle verde e occhi che hanno deciso qualcosa. Lui aveva scommesso dei soldi che non sarebbe venuta." } },
    { s: U, t: { en: "I was certain she would not come. When the bell rang I stood behind the door like a debtor — or like a man who has already lost and does not know the words for it.", it: "Ero certo che non sarebbe venuta. Quando la campanella suonò restai dietro la porta come un debitore — o come un uomo che ha già perso e non conosce le parole per dirlo." } },
    { s: "Liza", t: { en: "You gave me money. I brought it back. Not for the money — I want to know if what you said was spite, or the truth.", it: "Mi ha dato dei soldi. Li riporto indietro. Non per i soldi — voglio sapere se quello che ha detto era cattiveria, o la verità." } },
    { s: U, t: { en: "It was both, which is the worst of combinations. I said you should leave that house, marry, live. I said it like a man throwing stones at his own window.", it: "Era tutte e due le cose, che è la peggiore delle combinazioni. Le ho detto di lasciare quella casa, di sposarsi, di vivere. L'ho detto come un uomo che lancia sassi contro la propria finestra." } },
    { s: "Liza", t: { en: "Then say it once more, plainly. I will do it. I will leave the house. You could ask me anything tonight, and I would try to be a person again.", it: "Allora lo dica ancora una volta, semplicemente. Lo farò. Lascerò la casa. Potrebbe chiedermi qualsiasi cosa stasera, e proverei di nuovo a essere una persona." } },
    { s: N, t: { en: "And here — the record is accurate, God help us — he tells her about the burying of the coffin in the rain, about his own humiliation, everything, and it is almost tenderness.", it: "E qui — la registrazione è accurata, ci mancherebbe — le racconta della sepoltura della bara sotto la pioggia, della propria umiliazione, di tutto, ed è quasi tenerezza." } },
    { s: U, t: { en: "For one hour I was almost a man. Then I remembered I was the underground, and tenderness felt like debt, and debt like humiliation. I gave her money again. My last. And hated her.", it: "Per un'ora sono stato quasi un uomo. Poi mi sono ricordato di essere il sottosuolo, e la tenerezza è sembrata un debito, e il debito un'umiliazione. Le ho dato di nuovo dei soldi. I miei ultimi. E l'ho odiata." } },
    { s: N, t: { en: "She understood everything — that is the horror. She pressed the banknote into the table and went out without a word, and the underground kept its tenant.", it: "Lei ha capito tutto — ed è questo l'orrore. Ha conficcato la banconota nel tavolo ed è uscita senza una parola, e il sottosuolo ha mantenuto il suo inquilino." } }
  ],
  choices: [
    { text: { en: "Run after her — now, into the snow.", it: "Corri dietro di lei — adesso, nella neve." }, lines: [
      { s: U, t: { en: "I run — four flights, half a street, slippers in the snow. Whether I find her or not, I have come up. The underground is behind me, shouting terms; the wind up here answers nothing, it only blows. Note: this footnote is true. Cross out 'note'.", it: "Corro — quattro rampe di scale, mezza strada, pantofole nella neve. Che io la trovi o no, sono salito. Il sottosuolo è alle mie spalle che grida condizioni; il vento, quassù, non risponde a niente, soffia soltanto. Nota: questa nota è vera. Cancelli la parola «nota»." } }
    ] },
    { text: { en: "Stay: write it all down instead.", it: "Resta: scrivi tutto, invece." }, lines: [
      { s: N, t: { en: "He stays. He writes these notes. Somewhere a reader puts the page down, feeling seen by a man who has been dead for decades. That, too, is running after her — slower, and colder, and it is the only running he ever finished.", it: "Lui resta. Scrive questi appunti. Da qualche parte un lettore posa la pagina, sentendosi visto da un uomo morto da decenni. Anche questo è correre dietro di lei — più piano, e più freddo, ed è l'unica corsa che abbia mai finito." } }
    ] }
  ],
  outro: { en: "The underground has one stair, and it goes up.", it: "Il sottosuolo ha una sola scala, e va su." }
});
</script>

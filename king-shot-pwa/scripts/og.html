<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KING SHOT — social card source</title>
<style>
  :root {
    --ink: #f7f2e2;
    --muted: #c3bdd2;
    --accent: #ffcf6e;
    --accent2: #ff9f5e;
    --display: "Arial Narrow", "Avenir Next Condensed", "Franklin Gothic Medium", sans-serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body {
    position: relative;
    color: var(--ink);
    font-family: var(--body);
    background:
      radial-gradient(circle at 78% 20%, rgba(255, 233, 176, .2), transparent 30%),
      linear-gradient(145deg, #070b1d 0%, #171d42 48%, #4a2d5f 100%);
  }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(0, 0, 0, .42) 100%);
  }
  .copy {
    position: absolute;
    left: 82px;
    top: 70px;
    width: 690px;
    z-index: 2;
  }
  .crown { width: 54px; height: 54px; color: var(--accent); filter: drop-shadow(0 0 24px rgba(255, 207, 110, .45)); }
  .eyebrow {
    margin: 10px 0 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-size: 184px;
    font-weight: 900;
    line-height: .72;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-shadow: 0 18px 60px rgba(0, 0, 0, .45);
  }
  h1 span { display: block; }
  h1 span:last-child {
    background: linear-gradient(100deg, #ffcf6e, #ff9f5e 55%, #ffcf6e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin: 20px 0 0;
    max-width: 520px;
    color: var(--muted);
    font-size: 24px;
    line-height: 1.35;
    letter-spacing: .01em;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
  .tags span {
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(255, 255, 255, .06);
    color: #e9e3d3;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .tags span:first-child {
    border-color: rgba(255, 207, 110, .44);
    background: rgba(255, 207, 110, .12);
    color: var(--accent);
  }
  .app-icon {
    position: absolute;
    right: 92px;
    top: 128px;
    z-index: 2;
    width: 330px;
    height: 330px;
    border-radius: 74px;
    border: 1px solid rgba(255, 255, 255, .2);
    box-shadow: 0 35px 90px rgba(0, 0, 0, .55), 0 0 80px rgba(255, 207, 110, .18);
    transform: rotate(-5deg);
    overflow: hidden;
  }
  .app-icon img { display: block; width: 100%; height: 100%; }
  .stamp {
    position: absolute;
    right: 92px;
    bottom: 80px;
    z-index: 2;
    width: 330px;
    text-align: center;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .5);
  }
</style>
</head>
<body>
  <svg class="scene" viewBox="0 0 1200 630" aria-hidden="true">
    <defs>
      <radialGradient id="moonGlow">
        <stop offset="0" stop-color="#ffe9b0" stop-opacity=".38"/>
        <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4c4d78"/>
        <stop offset=".18" stop-color="#292b4a"/>
        <stop offset="1" stop-color="#131424"/>
      </linearGradient>
    </defs>
    <circle cx="960" cy="155" r="350" fill="url(#moonGlow)"/>
    <circle cx="960" cy="155" r="92" fill="#ffe9b0"/>
    <circle cx="936" cy="138" r="17" fill="#4a2d5f" opacity=".14"/>
    <circle cx="986" cy="178" r="11" fill="#4a2d5f" opacity=".12"/>
    <g fill="#fff6d8">
      <circle cx="150" cy="80" r="2.2" opacity=".6"/>
      <circle cx="310" cy="52" r="1.6" opacity=".45"/>
      <circle cx="470" cy="110" r="1.8" opacity=".5"/>
      <circle cx="670" cy="68" r="1.5" opacity=".4"/>
      <circle cx="1090" cy="80" r="2" opacity=".5"/>
      <circle cx="1140" cy="280" r="1.5" opacity=".4"/>
      <circle cx="90" cy="300" r="1.6" opacity=".35"/>
      <circle cx="760" cy="330" r="1.4" opacity=".35"/>
    </g>
    <path d="M0 400 L150 330 L290 388 L430 320 L580 392 L720 330 L860 386 L1000 328 L1200 390 L1200 630 L0 630Z" fill="#171a3a" opacity=".9"/>
    <path d="M0 455 L170 405 L340 456 L500 390 L670 455 L830 400 L1010 458 L1200 405 L1200 630 L0 630Z" fill="#0e1029"/>
    <path d="M0 545 L1200 545 L1200 630 L0 630Z" fill="url(#stone)"/>
    <g fill="#292b4a" stroke="#0a0b18" stroke-width="3">
      <rect x="20" y="520" width="54" height="30"/>
      <rect x="130" y="520" width="54" height="30"/>
      <rect x="240" y="520" width="54" height="30"/>
      <rect x="350" y="520" width="54" height="30"/>
      <rect x="460" y="520" width="54" height="30"/>
      <rect x="570" y="520" width="54" height="30"/>
      <rect x="680" y="520" width="54" height="30"/>
      <rect x="790" y="520" width="54" height="30"/>
      <rect x="900" y="520" width="54" height="30"/>
      <rect x="1010" y="520" width="54" height="30"/>
      <rect x="1120" y="520" width="54" height="30"/>
    </g>
    <g fill="none" stroke="#0a0b18" stroke-width="2" opacity=".35">
      <path d="M0 590h1200M0 620h1200"/>
      <path d="M80 556v34M190 556v34M300 556v34M410 556v34M520 556v34M630 556v34M740 556v34M850 556v34M960 556v34M1070 556v34M1180 556v34"/>
    </g>
  </svg>
  <div class="vignette"></div>

  <div class="copy">
    <svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 7 4.2 4.1L12 4l4.3 7.1L20.5 7l-1.4 11H4.9zM4.9 18h14.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <p class="eyebrow">The last wall</p>
    <h1><span>King</span><span>Shot</span></h1>
    <p class="tagline">The horde is at the gate.<br>You have one bow.</p>
    <div class="tags">
      <span>Archery roguelite</span>
      <span>Three oaths</span>
      <span>Daily siege</span>
      <span>Play free</span>
    </div>
  </div>

  <div class="app-icon"><img src="../icons/icon.svg" alt=""></div>
  <p class="stamp">A one-more-run arcade</p>
</body>
</html>

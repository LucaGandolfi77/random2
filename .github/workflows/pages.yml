name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bucio/package-lock.json
            new-star-soccer/package-lock.json
            dottor-gelo-pwa/package-lock.json

      - name: Build BUCIO (Vite + PWA)
        working-directory: bucio
        run: |
          npm ci
          npm run build

      - name: Build NEW STAR SOCCER (Vite + PWA)
        working-directory: new-star-soccer
        run: |
          npm ci
          npm run build

      - name: Build DOTTOR GELO (Vite + PWA)
        working-directory: dottor-gelo-pwa
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Everything except git metadata, CI config, analysis tooling and
          # the build-tool sources. `tools/` is dev-only (Python/Node) and has
          # no business being published to Pages.
          rsync -a --exclude='.git' --exclude='.github' --exclude='tools' --exclude='bucio' --exclude='new-star-soccer' --exclude='dottor-gelo-pwa' ./ _site/
          # Deploy the built app output under their own paths
          cp -R bucio/dist/ _site/bucio/
          cp -R new-star-soccer/dist/ _site/new-star-soccer/
          cp -R dottor-gelo-pwa/dist/ _site/dottor-gelo-pwa/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

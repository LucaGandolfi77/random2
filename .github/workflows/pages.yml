name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bucio/package-lock.json
            new-star-soccer/package-lock.json
            dottor-gelo-pwa/package-lock.json
            i-miserabili-parigi-2000/package-lock.json
            l-ultimo-bagno/package-lock.json
            il-prezzo-della-liberta/package-lock.json
            la-corona-e-la-testa/package-lock.json
            anna-karenina-film/package-lock.json
            briscola-pwa/package-lock.json
            les-miserables-film/package-lock.json
            self-non-self/package-lock.json

      - name: Build BUCIO (Vite + PWA)
        working-directory: bucio
        run: |
          npm ci
          npm run build

      - name: Build NEW STAR SOCCER (Vite + PWA)
        working-directory: new-star-soccer
        run: |
          npm ci
          npm run build

      - name: Build DOTTOR GELO (Vite + PWA)
        working-directory: dottor-gelo-pwa
        run: |
          npm ci
          npm run build

      - name: Build I Miserabili — Parigi 2000
        working-directory: i-miserabili-parigi-2000
        run: |
          npm ci
          npm run build

      - name: Build L'Ultimo Bagno
        working-directory: l-ultimo-bagno
        run: |
          npm ci
          npm run build

      - name: Build Il Prezzo della Libertà
        working-directory: il-prezzo-della-liberta
        run: |
          npm ci
          npm run build

      - name: Build La Corona e la Testa
        working-directory: la-corona-e-la-testa
        run: |
          npm ci
          npm run build

      - name: Build Briscola 1v1 (Vite + PWA + Supabase)
        working-directory: briscola-pwa
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Build LES MISÉRABLES — Le Fil d'Or
        working-directory: les-miserables-film
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build NEVE E FERRO
        working-directory: anna-karenina-film
        env:
          BASE_PATH: /${{ github.event.repository.name }}/anna-karenina-film/
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build SELF / NON-SELF
        working-directory: self-non-self
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Everything except git metadata, CI config, analysis tooling and
          # the build-tool sources. `tools/` is dev-only (Python/Node) and has
          # no business being published to Pages.
          # Il save ArnisWorld3 (575 MB) resta sorgente locale: si pubblicano
          # solo gli asset derivati in fidenza-city-v3/data/arnis/.
          rsync -a --exclude='.git' --exclude='.github' --exclude='tools' --exclude='bucio' --exclude='new-star-soccer' --exclude='dottor-gelo-pwa' --exclude='hype-brawl-game' --exclude='hype-ko-game' --exclude='i-miserabili-parigi-2000' --exclude='l-ultimo-bagno' --exclude='il-prezzo-della-liberta' --exclude='la-corona-e-la-testa' --exclude='briscola-pwa' --exclude='les-miserables-film' --exclude='anna-karenina-film' --exclude='self-non-self' --exclude='fidenza-city-v3/assets/ArnisWorld3' ./ _site/
          # Deploy the built app output under their own paths
          cp -R bucio/dist/ _site/bucio/
          cp -R new-star-soccer/dist/ _site/new-star-soccer/
          cp -R dottor-gelo-pwa/dist/ _site/dottor-gelo-pwa/
          cp -R i-miserabili-parigi-2000/dist/ _site/i-miserabili-parigi-2000/
          cp -R l-ultimo-bagno/dist/ _site/l-ultimo-bagno/
          cp -R il-prezzo-della-liberta/dist/ _site/il-prezzo-della-liberta/
          cp -R la-corona-e-la-testa/dist/ _site/la-corona-e-la-testa/
          cp -R briscola-pwa/dist/ _site/briscola-pwa/
          cp -R les-miserables-film/dist/ _site/les-miserables-film/
          cp -R anna-karenina-film/dist/ _site/anna-karenina-film/
          cp -R self-non-self/dist/ _site/self-non-self/
          touch _site/.nojekyll

      - name: Stamp Fidenza build
        run: |
          set -euo pipefail
          BUILD_ID="${GITHUB_SHA::12}"
          BUILD_DIR="fidenza-city-v3"
          python3 - "$BUILD_ID" <<'PY'
          import json, os, sys, datetime
          build_id = sys.argv[1]
          target = os.path.join('_site', 'fidenza-city-v3', 'build-info.json')
          os.makedirs(os.path.dirname(target), exist_ok=True)
          with open(target, 'w', encoding='utf-8') as fh:
              json.dump({
                  'version': '3.1.0',
                  'commit': os.environ.get('GITHUB_SHA', ''),
                  'buildId': build_id,
                  'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
              }, fh, ensure_ascii=False, indent=2)
          print('build-info.json', target)
          PY
          SW="_site/fidenza-city-v3/sw.js"
          sed -i "s/fidenza-da-giocare-v3\.1\.0/fidenza-da-giocare-${BUILD_ID}/" "$SW"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

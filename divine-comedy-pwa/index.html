  <h1 class="ls-heading">Divina Commedia — Act II</h1>
  <p class="ls-sub">The story continues from the scene that begins in the anthology. In English and Italian.</p>

<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "Acheron", it: "Acheronte" },
  place: { en: "The gate of Hell", it: "La porta dell'Inferno" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "The gate reads itself aloud: THROUGH ME YOU PASS INTO THE CITY OF WOE. Above it, the neutral angels who chose neither rebellion nor fidelity, stung by flies, at the banks of a river that is not a river.", it: "La porta si legge da sola: PER ME SI VA NELLA CITTÀ DOLENTE. Sopra, gli angeli neutri che non scelsero né ribellione né fedeltà, punto dalle mosche, alle rive di un fiume che fiume non è." } },
    { s: "Virgil", t: { en: "Do not ask about these wretches, Dante. The darkest places of hell are reserved for those who, in moral crisis, kept their neutrality.", it: "Non domandare di questi miseri, Dante. I luoghi più cupi dell'inferno sono riservati a coloro che, nella crisi morale, tesero alla neutralità." } },
    { s: "Dante", t: { en: "And the old man in the boat — his hair is white, his eyes are coals.", it: "E il vecchio nella barca — i capelli bianchi, gli occhi carbone." } },
    { s: "Virgil", t: { en: "Charon. Souls, not bodies, cross here. He will object to a living passenger; heaven permits it, and heaven outranks him.", it: "Caronte. Qui passano le anime, non i corpi. Opporrà resistenza a un passeggero vivo; il cielo lo permette, e il cielo gli sta sopra." } },
    { s: { en: "Charon", it: "Caronte" }, t: { en: "You who live, stand back from those who are dead! Your road is not mine. Shall I ferry a warm heart among my cold cargo?", it: "O tu che sei vivo, statti da parte da questi che son morti! La tua via non è la mia. Devo trasportare un cuore caldo tra il mio carico gelato?" } },
    { s: "Dante", t: { en: "I tremble, and the trembling is honest. Guide, the ground is dark and I would kneel.", it: "Tremo, e il tremare è onesto. Guida, il suolo è cupo e vorrei inginocchiarmi." } },
    { s: "Virgil", t: { en: "Sleep will come at the crossing. It is not a mercy; it is a custom — the living arrive at the farther shore carried, like children.", it: "Il sonno verrà nella traversata. Non è una pietà; è un costume — i vivi arrivano all'altra riva portati, come bambini." } },
    { s: N, t: { en: "A wind rises from the tears of the virtuous unbaptized, the sighing First Circle. Far below, something answers the thunder with thunder.", it: "Si leva un vento dalle lacrime dei virtuosi non battezzati, il Primo Cerchio che sospira. Molto sotto, qualcosa risponde al tuono con il tuono." } }
  ],
  choices: [
    { text: { en: "Board, and sleep the crossing.", it: "Sali a bordo, e dormi la traversata." }, lines: [
      { s: "Virgil", t: { en: "Sleep, then. When you wake, the air will not scream yet — we have six circles of quiet before the city of Dis. Learn the order of the map: even pain is architecture.", it: "Dormi, allora. Al risveglio l'aria non urlerà ancora — abbiamo sei cerchi di silenzio prima della città di Dite. Impara l'ordine della mappa: perfino il dolore è architettura." } }
    ] },
    { text: { en: "Ask who the sighing ones were.", it: "Chieda chi erano quelli che sospirano." }, lines: [
      { s: "Virgil", t: { en: "The virtuous pagans — Homer, your Aristotle, the unbaptized babies. They committed no fault, and for that alone they are denied the sight of God. You will feel it as longing, not flame. Sometimes hell is simply an absence, properly lit.", it: "I virtuosi pagani — Omero, il tuo Aristotele, i bambini non battezzati. Non commisero colpa, e per quello solo è negata loro la vista di Dio. Lo sentirai come desiderio, non come fiamma. A volte l'inferno è semplicemente un'assenza, illuminata a dovere." } }
    ] }
  ],
  outro: { en: "The map of the deep is also a map of the choices you already made.", it: "La mappa dell'abisso è anche la mappa delle scelte che hai già fatto." }
});
</script>

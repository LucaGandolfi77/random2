<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lucky Seven — Slot Arcade · 8 Machines</title>
    <meta name="description" content="A complete slot arcade: eight unique machines, ways and cluster pays, Hold & Win, wild variants, jackpots, daily challenges and VIP progression. Installable and playable offline.">
    <meta name="theme-color" content="#ffcc00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slot Arcade">
    <meta name="format-detection" content="telephone=no">
    <meta property="og:title" content="Lucky Seven — Slot Arcade">
    <meta property="og:description" content="Eight machines. Endless mechanics. One giant jackpot. An installable offline slot arcade.">
    <meta property="og:type" content="website">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="brand"><span class="brand-icon">🎰</span><span id="hud-machine">LUCKY SEVEN</span></div>
            <div class="hud">
                <span class="pill"><small>CREDITS</small><b id="hud-credits">1,000</b></span>
                <span class="pill win"><small>WIN</small><b id="hud-win">0</b></span>
                <span class="pill"><small>BET</small><b id="hud-bet">2</b></span>
                <span class="pill"><small>LINES</small><b id="hud-lines">20</b></span>
                <span class="pill vip"><small id="hud-vip-label">VIP 1</small><b id="hud-vip">ROOKIE</b></span>
            </div>
            <span id="hud-free" class="free-badge hidden">FREE ×0</span>
        </header>
        <main><canvas id="game-canvas" aria-label="Slot machine cabinet"></canvas></main>
    </div>

    <div id="offline-badge" class="badge hidden">⚠ OFFLINE</div>
    <button id="update-btn" class="badge update hidden">↻ UPDATE</button>

    <div id="install-banner" class="install-banner hidden">
        <span>📲 Install the Slot Arcade for the best experience</span>
        <button id="install-btn" class="btn primary">Install</button>
        <button id="install-later" class="btn">Later</button>
    </div>

    <div id="lobby-overlay" class="overlay lobby hidden" role="dialog" aria-modal="true">
        <div class="lobby-panel">
            <div class="panel-head">
                <div><h2>🎰 Slot Arcade</h2><p id="lobby-sub" class="sub"></p></div>
                <button id="lobby-close" class="close" aria-label="Close">✕</button>
            </div>
            <div id="lobby-tabs" class="lobby-tabs"></div>
            <div id="lobby-grid" class="lobby-grid"></div>
        </div>
    </div>

    <div id="panel-overlay" class="overlay hidden" role="dialog" aria-modal="true">
        <div class="panel">
            <div class="panel-head">
                <h2 id="panel-title">Lucky Seven</h2>
                <button id="panel-close" class="close" aria-label="Close">✕</button>
            </div>
            <div id="panel-body"></div>
        </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="../shared/arcade.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>

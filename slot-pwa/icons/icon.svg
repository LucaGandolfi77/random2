<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f2e"/><stop offset="1" stop-color="#050308"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset=".5" stop-color="#ffcc00"/><stop offset="1" stop-color="#a86b00"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="56" y="56" width="400" height="400" rx="64" fill="none" stroke="url(#gold)" stroke-width="12" filter="url(#glow)"/>
  <rect x="104" y="104" width="304" height="236" rx="22" fill="#0a0612" stroke="url(#gold)" stroke-width="8"/>
  <!-- three reel cells -->
  <rect x="120" y="120" width="86" height="204" rx="10" fill="#160d24"/>
  <rect x="213" y="120" width="86" height="204" rx="10" fill="#0f0819"/>
  <rect x="306" y="120" width="86" height="204" rx="10" fill="#160d24"/>
  <!-- cherries: red circles with stems -->
  <g>
    <path d="M163 150 q-4 -34 16 -44" stroke="#7bd66b" stroke-width="6" fill="none"/>
    <circle cx="163" cy="214" r="30" fill="#ff2d55"/>
    <path d="M349 150 q4 -34 -16 -44" stroke="#7bd66b" stroke-width="6" fill="none"/>
    <circle cx="349" cy="214" r="30" fill="#ff2d55"/>
  </g>
  <text x="256" y="272" font-family="Arial, sans-serif" font-weight="900" font-size="150" text-anchor="middle" fill="#ffcc00" filter="url(#glow)">7</text>
  <text x="256" y="390" font-family="Arial, sans-serif" font-weight="900" font-size="46" text-anchor="middle" fill="#ffcc00" filter="url(#glow)">LUCKY 7</text>
  <rect x="150" y="418" width="212" height="52" rx="18" fill="url(#gold)"/>
  <text x="256" y="453" font-family="Arial, sans-serif" font-weight="900" font-size="28" text-anchor="middle" fill="#1a0f2e">SPIN</text>

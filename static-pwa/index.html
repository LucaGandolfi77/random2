<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STATIC — Signal Pirate</title>
  <meta name="description" content="Sei un segnale TV pirata nella rete di cavi morti. Mangia pacchetti, conquista i televisori, sfuggi alle bande di censura. CRT, VHS, cromatische aberrazioni.">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STATIC">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <span class="pill">📶 <b id="score">0</b></span>
        <span class="pill" id="strength">▮▮▮</span>
        <span class="pill">📺 <b id="tvs">0</b></span>
      </div>
      <div class="hud-right">
        <span id="onair" class="badge hidden">🔴 ON AIR</span>
        <button id="sound-btn" class="iconbtn" aria-label="Audio">🔊</button>
      </div>
    </header>
    <main id="stage"><canvas id="game"></canvas><ol id="leaderboard"></ol></main>
    <div id="modal" class="overlay">
      <div class="sheet">
        <h2 id="m-title">STATIC</h2>
        <div id="m-body" class="body"></div>
        <div id="m-btns"></div>
      </div>
    </div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="../shared/arcade.js"></script>
  <script src="game.js"></script>
  <script src="service-worker.js"></script>
</body>
</html>

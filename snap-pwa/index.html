<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snap PWA — Camera with Filters</title>
  <meta name="description" content="A real-time camera with face lenses (MediaPipe FaceLandmarker) and retro filters. The snaps stay on your device.">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101014">

  <!-- iPhone / iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snap">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ START SCREEN ============ -->
  <section id="start" class="screen visible">
    <div class="start-inner">
      <div class="ghost" aria-hidden="true">👻</div>
      <h1>Snap<span>PWA</span></h1>
      <p class="tagline">A real-time camera with face lenses and retro filters.</p>
      <button id="start-btn" class="btn-gallo">Turn on the camera</button>
      <p class="privacy">🔒 Everything stays on your device — no uploads, no accounts.</p>
      <p id="start-error" class="error" role="alert" hidden></p>
    </div>
  </section>

  <!-- ============ CAMERA ============ -->
  <main id="camera" class="screen">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="flash" aria-hidden="true"></div>

    <header class="topbar">
      <button id="flip-btn" class="iconbtn" aria-label="Switch camera">🔄</button>
      <span class="spacer"></span>
      <button id="flash-btn" class="iconbtn" aria-label="Screen flash">⚡</button>
      <button id="memories-btn" class="iconbtn" aria-label="Memories">📚</button>
    </header>

    <!-- The status line is a live region: the app tells the user when the
         face engine is loading, and when it wants them to look at the
         camera. A screen reader has to hear both. -->
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <button id="shutter" aria-label="Take a photo"><span class="ring"></span></button>

    <nav id="carousel" class="carousel" aria-label="Filters"></nav>
  </main>

  <!-- ============ SNAP PREVIEW ============ -->
  <section id="preview" class="screen">
    <img id="preview-img" alt="Your snap">
    <video id="preview-video" playsinline loop hidden></video>
    <input id="caption" type="text" aria-label="Caption" maxlength="80" placeholder="Add a caption…" autocomplete="off">
    <div class="preview-actions">
      <button id="discard-btn" class="iconbtn" aria-label="Discard">✖</button>
      <button id="download-btn" class="iconbtn" aria-label="Download">⬇️</button>
      <button id="save-btn" class="btn-gallo">💾 Save to Memories</button>
    </div>
  </section>

  <!-- ============ MEMORIES ============ -->
  <section id="memories" class="screen">
    <header class="mem-header">
      <h2>📚 Memories</h2>
      <button id="memories-close" class="iconbtn" aria-label="Close">✖</button>
    </header>
    <div id="memories-grid" class="mem-grid"></div>
    <p id="memories-empty" class="mem-empty" hidden>No snaps yet…<br>Take one! 👻</p>
  </section>

  <!-- ============ VIEWER ============ -->
  <div id="viewer" class="screen">
    <img id="viewer-img" alt="Snap">
    <video id="viewer-video" playsinline controls hidden></video>
    <p id="viewer-caption"></p>
    <div class="viewer-actions">
      <button id="viewer-download" class="iconbtn" aria-label="Download">⬇️</button>
      <button id="viewer-delete" class="iconbtn" aria-label="Delete">🗑️</button>
      <button id="viewer-close" class="iconbtn" aria-label="Close">✖</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

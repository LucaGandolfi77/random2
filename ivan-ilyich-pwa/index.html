  <h1 class="ls-heading">The Death of Ivan Ilyich · Leo Tolstoy</h1>
  <p class="ls-sub">Three acts on mortality, falsity, and the light at the bottom of the black sack. In English and Italian.</p>
  <div id="scene"></div>
  <div class="ls-foot"><a href="../anthology-pwa/">← The Library — La Biblioteca</a></div>
</div>
<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  bookId: "ivan_ilyich",
  backHref: "../anthology-pwa/",
  statInit: { mem: 8, mel: 10, art: 4 },
  acts: [
    {
      tab: { en: "Act I · The Verdict", it: "Atto I · La Sentenza" },
      title: { en: "Act I · The Curtain and the Syllogism", it: "Atto I · Il tendaggio e il sillogismo" },
      place: { en: "St. Petersburg, the new drawing-room", it: "San Pietroburgo, il salotto nuovo" },
      theme: "attic",
      lines: [
        { s: N, t: { en: "Ivan Ilyich's life had been most simple and most ordinary, and therefore most terrible. Judge, whist player, husband of a demanding wife, he climbed a ladder to hang a curtain — and slipped.", it: "La vita di Ivan Il'ič era stata semplicissima e comunissima, e perciò terribilissima. Giudice, giocatore di whist, marito d'una moglie esigente, salì su una scaletta per drappeggiare una tenda — e scivolò." } },
        { s: "Ivan Ilyich", t: { en: "A mere bruise against the window knob. Nothing at all. Why then does this strange taste remain in my mouth, and this dull weight in my left side?", it: "Una semplice ammaccatura contro il pomolo della finestra. Niente di che. Perché allora mi resta questo sapore strano in bocca, e questo peso sordo nel fianco sinistro?" } },
        { s: { en: "The Famous Doctor", it: "Il Celebre Medico" }, t: { en: "A floating kidney, or perhaps the blind gut. Observe how I tap and listen, exactly as you judges interrogate a prisoner in court.", it: "Un rene mobile, o forse l'intestino cieco. Osservi come percuoto e ausculto, esattamente come voi giudici interrogate un imputato in tribunale." } },
        { s: "Ivan Ilyich", t: { en: "Doctor, leave the Latin aside and answer the only question that exists: is my condition dangerous, or not?", it: "Dottore, lasci stare il latino e risponda all'unica domanda che esiste: il mio stato è pericoloso, oppure no?" } },
        { s: N, t: { en: "In the textbook of Kiesewetter's Logic he had learned in childhood: 'Caius is a man, men are mortal, therefore Caius is mortal.' That had always applied only to Caius, not to him.", it: "Nel manuale di logica di Kiesewetter aveva imparato da ragazzo: «Caio è un uomo, gli uomini sono mortali, dunque Caio è mortale». Quello era sempre valso solo per Caio, non per lui." } },
        { s: "Ivan Ilyich", t: { en: "Caius is a man in the abstract. Optimize that all you like — I was little Vanya, who smelled the leather of my father's striped ball and kissed my mother's hand! Can it really be that I too must die?", it: "Caio è un uomo in astratto. Ragionate pure — io ero il piccolo Vanja, che odorava il cuoio della palla a strisce di mio padre e baciava la mano di mia madre! Possibile che anch'io debba morire?" } }
      ],
      choices: [
        { text: { en: "Turn your face to the wall in the study and refuse the lie.", it: "Volta la faccia verso il muro nello studio e rifiuta la menzogna." }, effect: { mem: 3, mel: 2, art: 1 }, lines: [
          { s: N, t: { en: "What torments him most is the lie — the polite conspiracy of his family pretending he is merely ill and not dying, reducing the solemn act of his death to an unpleasantness at a reception.", it: "Ciò che più lo tormenta è la menzogna — la cortese congiura della famiglia che finge ch'egli sia solo malato e non morente, riducendo l'atto solenne della sua morte a una sconvenienza da salotto." } }
        ] },
        { text: { en: "Try to play one more hand of bridge with your colleagues.", it: "Prova a giocare ancora una mano di bridge con i colleghi." }, effect: { mem: 1, mel: 3, art: 0 }, lines: [
          { s: N, t: { en: "He bids a grand slam and suddenly sees that the cards, the candles, and the bronze candlesticks are thinner than paper over an abyss.", it: "Chiama un grande slam e vede d'un tratto che le carte, le candele e i candelabri di bronzo sono più sottili della carta sopra un abisso." } }
        ] }
      ],
      outro: { en: "Caius is mortal, and it is right for him to die; Move on — what has that to do with me?", it: "Caio è mortale, ed è giusto che muoia; ma per me, per il piccolo Vanja, è tutt'altra cosa." }
    },
    {
      tab: { en: "Act II · Gerasim", it: "Atto II · Gerasim" },
      title: { en: "Act II · Gerasim and the Black Sack", it: "Atto II · Gerasim e il sacco nero" },
      place: { en: "The study, the final weeks", it: "Lo studio, le ultime settimane" },
      theme: "candles",
      lines: [
        { s: N, t: { en: "Only one person in the house does not lie: the peasant pantry-boy Gerasim, who smells of winter air and boot-tar.", it: "Una sola persona in tutta la casa non mente: il giovane contadino Gerasim, che odora d'aria d'inverno e di catrame." } },
        { s: "Gerasim", t: { en: "Ivan Ilyich, rest your feet here on my shoulders. It is no trouble at all. We shall all of us die someday, so why shouldn't I take a little trouble now?", it: "Ivan Il'ič, appoggi i piedi qui sulle mie spalle. Non è nessun disturbo. Tutti dobbiamo morire un giorno, perché non dovrei darmi un po' di pena adesso?" } },
        { s: "Ivan Ilyich", t: { en: "When everyone else looks at me, their eyes say: 'You will die and we will stay.' Only Gerasim's hands say: 'We are mortals together.'", it: "Quando gli altri mi guardano, i loro occhi dicono: «Tu morirai e noi resteremo». Solo le mani di Gerasim dicono: «Siamo mortali insieme»." } },
        { s: N, t: { en: "At night he dreams that they are shoving him into a narrow, deep black sack, and he is both helping them and resisting because of the unbearable pain.", it: "Di notte sogna che lo spingano dentro un sacco nero, stretto e profondo, ed egli insieme li aiuta e resiste per il dolore insopportabile." } },
        { s: { en: "Voice of the Soul", it: "La Voce dell'Anima" }, t: { en: "What do you want?", it: "Che cosa vuoi?" } },
        { s: "Ivan Ilyich", t: { en: "To live! To live as I lived before — pleasantly, properly! Wait… What if my whole correct, decorous life was really not the right thing?", it: "Vivere! Vivere come vivevo prima — bene, piacevolmente! Aspetta… E se tutta la mia vita corretta e decorosa fosse stata in realtà «non la cosa giusta»?" } }
      ],
      choices: [
        { text: { en: "Admit the truth: everything since childhood was a polite falsehood.", it: "Ammetti la verità: tutto, dopo l'infanzia, è stato una educata falsità." }, effect: { mem: 4, mel: 1, art: 2 }, lines: [
          { s: N, t: { en: "Every time he had felt a real human impulse — pity for a prisoner, tenderness for his wife or child — he had crushed it in the name of official correctness.", it: "Ogni volta che aveva provato un vero moto umano — pietà per un imputato, tenerezza per la moglie o il figlio — l'aveva soffocato in nome della correttezza ufficiale." } }
        ] },
        { text: { en: "Send Gerasim away at dawn so the boy can sleep.", it: "Manda Gerasim a dormire all'alba perché il ragazzo riposi." }, effect: { mem: 2, mel: 2, art: 1 }, lines: [
          { s: N, t: { en: "Alone in the dark room, the black sack presses closer, waiting for the one admission that can tear it open.", it: "Solo nella stanza buia, il sacco nero si stringe più forte, aspettando l'unica confessione capace di squarciarlo." } }
        ] }
      ],
      outro: { en: "The sack was never Death. It was everything he called living.", it: "Il sacco non è mai stata la Morte. Era tutto ciò che lui chiamava vivere." }
    },
    {
      tab: { en: "Act III · The Light", it: "Atto III · La Luce" },
      title: { en: "Act III · The Three Days' Scream and the Light", it: "Atto III · I tre giorni d'urlo e la Luce" },
      place: { en: "The threshold of death", it: "Sulla soglia della morte" },
      theme: "paradiso",
      lines: [
        { s: N, t: { en: "For three days, during which time did not exist for him, he struggled in that black sack into which an invisible, irresistible force was pushing him.", it: "Per tre giorni, durante i quali il tempo per lui non esistette, si dibatté in quel sacco nero in cui una forza invisibile e irresistibile lo cacciava." } },
        { s: N, t: { en: "Suddenly some force struck him in the chest and side. He fell through the hole — and there, at the bottom of the sack, something caught his hand.", it: "All'improvviso una forza lo colpì al petto e al fianco. Cadde attraverso il foro — e là, in fondo al sacco, qualcosa gli afferrò la mano." } },
        { s: N, t: { en: "He opened his eyes. His twelve-year-old schoolboy son Vasya had crept up to his bed, caught his falling hand, pressed it to his lips, and burst into tears.", it: "Aprì gli occhi. Suo figlio Vasja, lo scolaretto di dodici anni, s'era avvicinato al letto, gli aveva preso la mano cadente, se l'era premuta sulle labbra ed era scoppiato a piangere." } },
        { s: "Ivan Ilyich", t: { en: "At the very moment I fell through, I saw that my life had not been what it ought, but that it could still be rectified. I feel so sorry for him… and for my wife too.", it: "Nel momento stesso in cui sono caduto giù, ho visto che la mia vita non era stata quella che doveva, ma che si poteva ancora rimediare. Mi fa tanta pena il bambino… e anche mia moglie." } },
        { s: "Ivan Ilyich", t: { en: "I wanted to say 'Forgive me' — and by a slip of the tongue I said 'Forego' — and waved my hand, knowing that He whose understanding mattered would understand.", it: "Volevo dire «Perdona» — e con la lingua impacciata ho detto «Lascia passare» — e ho fatto un cenno con la mano, sapendo che Colui che doveva capire avrebbe capito." } },
        { s: "Ivan Ilyich", t: { en: "Where is pain? Where are you, Death? There is no fear because there is no death. Instead of death, there was light!", it: "Dov'è il dolore? Dove sei, Morte? Non c'è paura perché la morte non c'è. In luogo della morte, c'era la luce!" } }
      ],
      choices: [
        { text: { en: "Step into the light: 'Death is finished. It is no more.'", it: "Entra nella luce: «È finita la morte. Non c'è più»." }, effect: { mem: 4, mel: -3, art: 3 }, lines: [
          { s: N, t: { en: "To those around the bed his agony lasted two hours more. In his own breast, that instant of light stood still and never changed.", it: "Per coloro che stavano intorno al letto la sua agonia durò ancora due ore. Nel suo petto, quell'istante di luce rimase immobile e non mutò mai più." } }
        ] },
        { text: { en: "Press little Vasya's hand one last time.", it: "Stringi un'ultima volta la mano del piccolo Vasja." }, effect: { mem: 4, mel: -1, art: 2 }, lines: [
          { s: N, t: { en: "Pity for another human being dissolved the wall that sixty years of respectability had built.", it: "La pietà per un'altra creatura umana sciolse il muro che sessant'anni di rispettabilità avevano innalzato." } }
        ] }
      ],
      outro: { en: "Death is finished, he said to himself. It is no more.", it: "È finita la morte, disse a se stesso. Non c'è più." }
    }
  ]
});
</script>

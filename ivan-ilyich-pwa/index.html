  <h1 class="ls-heading">Death of Ivan Ilyich — Act II</h1>
  <p class="ls-sub">The story continues from the scene that begins in the anthology. In English and Italian.</p>
  <div id="scene"></div>
  <div class="ls-foot"><a href="../anthology-pwa/">← The Library — La Biblioteca</a></div>

<script src="../shared/scene-reader.js"></script>
<script>
var N = { en: "Narrator", it: "Narratore" };
LibraryScene.open({
  mount: document.getElementById("scene"),
  title: { en: "The Black Sack", it: "Il sacco nero" },
  place: { en: "The study, the final weeks", it: "Lo studio, le ultime settimane" },
  backHref: "../anthology-pwa/",
  lines: [
    { s: N, t: { en: "The doctors now speak of months in the plural, which is a mercy and a sentence. The pain has become a roommate with opinions.", it: "I medici ormai parlano di mesi al plurale, il che è una pietà e una condanna. Il dolore è diventato un coinquilino con opinioni." } },
    { s: "Ivan Ilyich", t: { en: "Everyone will die. I am not special — and yet this sack closes on me alone, personally, as if I were its only appointment.", it: "Tutti devono morire. Non sono un caso speciale — eppure questo sacco si stringe su di me solo, personalmente, come se fossi io il suo unico appuntamento." } },
    { s: "Gerasim", t: { en: "Ivan Ilyich, I hold your legs like this. You sleep better when someone shares the weight. It is nothing; I will be old too.", it: "Ivan Ilyič, io le tengo le gambe così. Dorme meglio quando qualcuno divide il peso. Non è niente; anch'io sarò vecchio." } },
    { s: "Ivan Ilyich", t: { en: "When he says 'we all must die someday' it does not frighten me. When the doctors say 'case' I want to strike them. Why is the peasant gentle and the professor cruel?", it: "Quando lui dice «tutti devono morire» non mi spaventa. Quando i medici dicono «caso» vorrei colpirli. Perché il contadino è dolce e il professore crudele?" } },
    { s: { en: "His wife", it: "Sua moglie" }, t: { en: "Praskovya, the upholsterer sent samples — you cannot lie on the old chaise. Ivan, do you hear me? Ivan, the samples.", it: "Praskovja, il tappezziere ha mandato i campioni — sulla vecchia chaise longue non ci si può sdraiare. Ivan, mi senti? Ivan, i campioni." } },
    { s: "Ivan Ilyich", t: { en: "She is arguing about fabric at the edge of my grave. Perhaps that is her way of holding my hand. Perhaps there is no way, and the sack is alone.", it: "Sta discutendo di stoffe al limitare della mia fossa. Forse è il suo modo di tenermi la mano. Forse non c'è modo, e il sacco è solo." } },
    { s: N, t: { en: "At three in the morning the last argument of his life takes place in silence: not against death, but against the wrong life he perfected. The sack waits, patient as furniture.", it: "Alle tre del mattino l'ultima lite della sua vita si svolge in silenzio: non contro la morte, ma contro la vita sbagliata che ha perfezionato. Il sacco aspetta, paziente come un mobile." } },
    { s: "Ivan Ilyich", t: { en: "So that is it. What if — at the end — I could still say: forgive me, and mean all of it?", it: "Ecco cos'è. E se — alla fine — potessi ancora dire: perdonatemi, e intenderlo fino in fondo?" } }
  ],
  choices: [
    { text: { en: "Say the forgiveness out loud, to them.", it: "Dì il perdono ad alta voce, a loro." }, lines: [
      { s: N, t: { en: "He says it to his son's wet eyes, to his wife's fabric arguments, to Gerasim's rough hands. The sack does not vanish. It stops closing. Light has no walls; he steps through as through a door left open on purpose.", it: "Lo dice agli occhi bagnati del figlio, alle discussioni di stoffe della moglie, alle mani rozze di Gerasim. Il sacco non svanisce. Smette di stringersi. La luce non ha pareti; passa attraverso come attraverso una porta lasciata aperta apposta." } }
    ] },
    { text: { en: "Hold on: point at the doctors, the committee, the injustice.", it: "Resisti: indica i medici, il comitato, l'ingiustizia." }, lines: [
      { s: N, t: { en: "He holds out for nine more days, winning every argument and losing the only case. At the end his face says: it is finished — and it is not the gospel sentence; it is an inventory.", it: "Resiste altri nove giorni, vincendo ogni discussione e perdendo l'unica causa. Alla fine il suo volto dice: è compiuto — e non è la frase del vangelo; è un inventario." } }
    ] }
  ],
  outro: { en: "The sack was never Death. It was everything he called living.", it: "Il sacco non è mai stata la Morte. Era tutto ciò che lui chiamava vivere." }
});
</script>
